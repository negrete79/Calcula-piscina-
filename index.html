<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0096D6">
<link rel="manifest" href="manifest.json">
<title>Calculadora do Elias — Método Copo Americano</title>
<style>
:root{--azul:#0096D6;--azul-forte:#007BB3;--borda:#D8ECF6;--agua:#E1F4FC;--agua-2:#F2FAFE;--ink:#0A2E42;--ink-2:#33657F;--verde:#0E7C5B;--verde-bg:#E7F7F0;--verde-bd:#BFE7D6;--verm:#B3362B;--verm-bg:#FCEEEC;--verm-bd:#F1C8C3;--ambar:#9A5B0B;--ambar-bg:#FFF6E4;--ambar-bd:#F2D9A8;--radius:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Nunito,sans-serif;color:var(--ink);background:#fff}
header.topo{background:var(--azul);color:#fff;padding:12px 16px 46px;position:relative}
nav.steps{max-width:640px;margin:18px auto;display:flex;gap:8px;padding:0 18px}
.no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2.5px solid var(--borda);font:800 15px Baloo 2;cursor:pointer}
.no.atual{border-color:var(--azul);color:var(--azul);transform:scale(1.12)}
.no.feito{background:var(--verde-bg);border-color:var(--verde-bd);color:var(--verde)}
.lig{flex:1;height:3px;background:var(--borda);margin-top:20px}
.lig.ok{background:#7FC8A9}
main{max-width:640px;margin:0 auto;padding:8px 18px 40px}
section{display:none}section.ativa{display:block}
.card{background:#fff;border:1px solid var(--borda);border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(0,90,140,.1);margin-top:12px}
.btn{background:var(--azul);color:#fff;border:none;border-radius:15px;padding:15px 22px;font:800 15px Nunito;cursor:pointer}
.campo label{font-size:12px;font-weight:800;color:var(--ink-2)}
.in-wrap{display:flex;background:var(--agua-2);border:2px solid var(--borda);border-radius:13px;height:48px;margin:6px 0 12px}
.in-wrap input{flex:1;border:none;background:transparent;padding:0 13px;font:800 16px Nunito;outline:none}
.resultado{margin-top:18px;background:var(--azul);color:#fff;border-radius:20px;padding:22px}
.an-sc{border:1.5px solid var(--borda);border-radius:12px;padding:9px;text-align:center}
.an-sc.ok{background:var(--verde-bg);border-color:var(--verde-bd)}
.an-sc.ruim{background:var(--verm-bg);border-color:var(--verm-bd)}
.an-sc.medio{background:var(--ambar-bg);border-color:var(--ambar-bd)}
.an-fix{display:flex;gap:11px;background:var(--agua-2);border:1.5px solid var(--borda);border-left:4px solid var(--ambar);border-radius:12px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<header class="topo">
<h1>Calculadora do Elias — Método Copo Americano</h1>
<p>SEM MISTÉRIO, DIRETO AO PONTO</p>
</header>
<nav class="steps">
<div class="no atual" onclick="ir(1)">1</div><div class="lig" id="l1"></div>
<div class="no" onclick="ir(2)" id="n2">2</div><div class="lig" id="l2"></div>
<div class="no" onclick="ir(3)" id="n3">3</div>
</nav>
<main>
<section id="s1" class="ativa">
<div class="card">
<h2>1. Volume da piscina</h2>
<label>Formato</label>
<select id="formato" onchange="calcVol()"><option value="ret">Retangular</option><option value="red">Redonda</option><option value="ova">Oval</option></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<div class="campo"><label>Comp (m)</label><div class="in-wrap"><input id="comp" type="number" oninput="calcVol()"></div></div>
<div class="campo"><label>Larg (m)</label><div class="in-wrap"><input id="larg" type="number" oninput="calcVol()"></div></div>
<div class="campo"><label>Prof rasa</label><div class="in-wrap"><input id="prasa" type="number" step="0.1" oninput="calcVol()"></div></div>
<div class="campo"><label>Prof funda</label><div class="in-wrap"><input id="pfunda" type="number" step="0.1" oninput="calcVol()"></div></div>
</div>
<div id="resVol" class="resultado" style="display:none"></div>
<button class="btn" onclick="ir(2)">Próximo →</button>
</div>
</section>
<section id="s2">
<div class="card">
<h2>2. Revestimento</h2>
<select id="revest"><option>Vinil</option><option>Fibra</option><option>Cerâmica</option></select>
<button class="btn" onclick="ir(3)">Próximo →</button>
</div>
</section>
<section id="s3">
<div class="card">
<h2>3. Análise - CORREÇÃO DO BUG DO PRINT</h2>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<div class="campo"><label>Alcalinidade (ppm) alvo 80-120</label><div class="in-wrap"><input id="alc" type="number" oninput="analisar()"></div></div>
<div class="campo"><label>pH alvo 7,2-7,4</label><div class="in-wrap"><input id="ph" type="number" step="0.1" oninput="analisar()"></div></div>
<div class="campo"><label>Cloro (ppm)</label><div class="in-wrap"><input id="clo" type="number" step="0.1" oninput="analisar()"></div></div>
</div>
<div id="cardsStatus" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px"></div>
<div id="fixes"></div>
<div id="doseBox" style="margin-top:14px"></div>
</div>
</section>
</main>
<script>
let volumeLitros=0, agua='cristalina';
function ir(n){document.querySelectorAll('section').forEach(s=>s.classList.remove('ativa'));document.getElementById('s'+n).classList.add('ativa');document.querySelectorAll('.lig').forEach((el,i)=>{el.classList.toggle('ok',i+1<n)});window.scrollTo({top:0,behavior:'smooth'})}
function calcVol(){const c=parseFloat(comp.value)||0,l=parseFloat(larg.value)||0,pr=parseFloat(prasa.value)||0,pf=parseFloat(pfunda.value)||0;const prof=(pr+pf)/2||pr||pf;let m3=0;if(formato.value=='ret')m3=c*l*prof;else m3=c*l*prof*0.785;volumeLitros=m3*1000;if(m3>0){resVol.style.display='block';resVol.innerHTML=`<b>${Math.round(volumeLitros).toLocaleString('pt-BR')} L</b> - ${m3.toFixed(1)} m³ - Prof média ${prof.toFixed(2)}m<br>${(volumeLitros/45000).toFixed(1)} copos padrão`;localStorage.setItem('vol',volumeLitros)}analisar()}
// FUNÇÕES CORRIGIDAS - ISSO QUE CONSERTA SEU PRINT
function statusAlc(v){if(isNaN(v))return{v:'-',cls:'',label:'-'};if(v<80)return{v:v+' ppm',cls:'ruim',label:'BAIXA'};if(v>120)return{v:v+' ppm',cls:'medio',label:'ALTA'};return{v:v+' ppm',cls:'ok',label:'NA FAIXA'}}
function statusPH(v){if(isNaN(v))return{v:'-',cls:'',label:'-'};if(v<7.2)return{v:v.toFixed(1).replace('.',','),cls:'ruim',label:'BAIXO'};if(v>7.4)return{v:v.toFixed(1).replace('.',','),cls:'ruim',label:'ALTO'};return{v:v.toFixed(1).replace('.',','),cls:'ok',label:'NA FAIXA'}}
function statusCloro(v,verde){if(isNaN(v))return{v:'-',cls:'',label:'-'};if(verde){if(v<2.5)return{v:v.toFixed(1)+' ppm',cls:'ruim',label:'BAIXO - CHOQUE'};if(v>5)return{v:v.toFixed(1)+' ppm',cls:'medio',label:'ALTO'};return{v:v.toFixed(1)+' ppm',cls:'ok',label:'EM CHOQUE'}}else{if(v<1)return{v:v.toFixed(1)+' ppm',cls:'ruim',label:'BAIXO'};if(v>3)return{v:v.toFixed(1)+' ppm',cls:'medio',label:'ALTO'};return{v:v.toFixed(1)+' ppm',cls:'ok',label:'NA FAIXA'}}}
function analisar(){const alc=parseFloat(document.getElementById('alc').value),ph=parseFloat(document.getElementById('ph').value),clo=parseFloat(document.getElementById('clo').value);const sAlc=statusAlc(alc),sPH=statusPH(ph),sClo=statusCloro(clo,agua=='verde');cardsStatus.innerHTML=`<div class="an-sc ${sAlc.cls}"><small>ALCALINIDADE</small><br><b>${sAlc.v}</b><br>${sAlc.label}</div><div class="an-sc ${sPH.cls}"><small>PH</small><br><b>${sPH.v}</b><br>${sPH.label}</div><div class="an-sc ${sClo.cls}"><small>CLORO</small><br><b>${sClo.v}</b><br>${sClo.label}</div>`;let f='';if(!isNaN(alc)&&alc<80&&volumeLitros>0){const g=(100-alc)*1.5*(volumeLitros/1000);f+=`<div class="an-fix"><b>${(g/1000).toFixed(1).replace('.',',')} kg (${(g/190).toFixed(1)} copos) Bicarbonato</b><br><small>Dilua 5 copos por vez no balde! Nunca tudo.</small></div>`}fixes.innerHTML=f;const copo=volumeLitros/45000;doseBox.innerHTML=volumeLitros>0?`<div class="card" style="border-left:6px solid #0096D6"><b>Manutenção:</b> ${copo.toFixed(1)} copos (${Math.round(copo*190)}g) cloro 65%<br><b>Choque água verde:</b> ${(copo*3).toFixed(1)} copos</div>`:'Informe volume';}
</script>
</body>
</html>
