<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14B8C9">
<title>Piscina Inteligente v3.0 — Cachoeira do Campo</title>
<!-- ★ FIX PWA: manifest + ícones + modo app -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piscina App">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,'Segoe UI',sans-serif;background:#D9E2E8;color:#1B2C5E;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.ic{display:inline-block;vertical-align:middle;flex:none}
#app{max-width:480px;margin:0 auto;background:#EDF2F6;min-height:100dvh;position:relative;padding-bottom:96px;box-shadow:0 0 44px rgba(20,40,70,.15)}
.page{padding-bottom:10px}

/* ---------- cabeçalhos ---------- */
.hdr{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;padding:20px 18px 6px}
.hdr .h-side{font-size:16px;font-weight:600;color:#7C8FA0}
.hdr h1{font-size:22px;font-weight:800;text-align:center;letter-spacing:-.3px;color:#1B2C5E}
.hdr .h-btn{justify-self:end;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#1B2C5E}
.thdr{background:#14B8C9;color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:16px 10px;position:relative}
.thdr h1{font-size:20px;font-weight:800;text-align:center;line-height:1.25;letter-spacing:-.2px}
.thdr .t-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.thdr .t-btn:active{background:rgba(255,255,255,.18)}
.lhdr{background:#E4F6F5;padding:14px 12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.lhdr h1{font-size:20px;font-weight:800;text-align:center;color:#123B4C;letter-spacing:-.3px}
.lhdr .l-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#123B4C}

/* ---------- hero ---------- */
.hero{margin:10px 16px 0;background:linear-gradient(105deg,#45D8C6 0%,#0CB7DA 100%);border-radius:22px;padding:24px 20px 30px;position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;box-shadow:0 14px 30px -14px rgba(12,150,170,.55)}
.hero-l{flex:none;position:relative;z-index:1}
.hero-r{flex:1;position:relative;z-index:1;min-width:0}
.hero-lit{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.6px;line-height:1.1;text-shadow:0 1px 6px rgba(0,60,80,.15)}
.hero-shape{font-size:17px;font-weight:600;color:rgba(255,255,255,.95);margin-top:2px}
.hero-pill{margin-top:14px;display:flex;gap:9px;align-items:center;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);border-radius:13px;padding:8px 11px}
.hero-pill small{display:block;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.9);line-height:1.2}
.hero-pill b{display:block;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.waves{position:absolute;bottom:-2px;left:0;width:100%;height:44px;pointer-events:none}

/* ---------- status ---------- */
.sec{font-size:24px;font-weight:800;color:#1B2C5E;margin:24px 18px 12px;letter-spacing:-.4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.stat{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 6px rgba(20,40,70,.05),0 12px 26px -18px rgba(20,40,70,.25);text-align:left}
.stat-top{display:flex;align-items:center;gap:10px}
.stat-label{font-size:15px;font-weight:600;color:#22406B}
.c-ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.c-ic.ph{background:#DFF3D6;color:#4E9E4E;font-size:13.5px;font-weight:800}
.c-ic.ocl{background:#FF9D2E}.c-ic.obl{background:#2FA7E0}
.stat-val{font-size:33px;font-weight:800;color:#1B2C5E;letter-spacing:-1px;margin:8px 0 8px 2px}
.stat-badges{display:flex;align-items:center;gap:8px;margin-left:2px}
.bdg{font-size:13px;font-weight:700;padding:5px 14px;border-radius:10px}
.bdg.ok{background:#C0E8B8;color:#256B2F}
.bdg.warn{background:#FFB55C;color:#7A3E00}
.bdg.bad{background:#F8C1C1;color:#8E2020}
.unit{font-size:12.5px;color:#7C8FA0;font-weight:600}

/* ---------- banner + botões ---------- */
.banner{margin:16px 16px 0;background:#FFE2B0;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:calc(100% - 32px)}
.banner.grn{background:#D6F2D9}
.banner .b-ic{width:34px;height:34px;border-radius:50%;background:#F08C00;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.banner.grn .b-ic{background:#2FA35A}
.banner b{display:block;font-size:16.5px;font-weight:800;color:#1B2C5E;letter-spacing:-.2px}
.banner p{font-size:12.5px;color:#6B5636;line-height:1.5;margin-top:3px}
.banner.grn p{color:#33604A}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:16px 16px 0;padding:17px;border-radius:14px;background:#14B8C9;color:#fff;font-size:20px;font-weight:800;letter-spacing:-.2px;box-shadow:0 12px 24px -10px rgba(20,184,201,.6)}
.bigbtn:active{transform:scale(.985)}
.install{background:#5E3D9C;color:#fff;display:flex;align-items:center;gap:13px;margin:16px 16px 0;border-radius:18px;padding:14px}
.i-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.i-txt{flex:1}
.i-txt b{display:block;font-size:14px}
.i-txt span{display:block;font-size:11.5px;color:rgba(255,255,255,.82);margin-top:2px;line-height:1.45}
.install button{background:#fff;color:#5E3D9C;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:800}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;border-top:1px solid #E5EDF1}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#8A9BAA;padding:4px 0;border-radius:12px}
.tabbar button.on{color:#14B8C9;font-weight:700}

/* ---------- CONFIG ---------- */
.csec{padding:0 18px}
.csec h2{font-size:23px;font-weight:800;color:#123B4C;letter-spacing:-.4px}
.csec .sub{font-size:14.5px;color:#5F7385;margin-top:2px}
.fmt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.fmt{position:relative;border:1.5px solid #D8E2E8;border-radius:16px;background:#fff;padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#33475C}
.fmt span{font-size:11.5px;font-weight:600}
.fmt.on{border:2px solid #14B8C9;background:#DFF7FB;color:#0E7183}
.fmt .chk{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#14B8C9;color:#fff;display:none;align-items:center;justify-content:center;border:2.5px solid #EDF2F6}
.fmt.on .chk{display:flex}
.divider{height:1px;background:#E2EBF0;margin:20px 18px}

/* ★ FIX PRINCIPAL: label é inline por padrão → os campos se sobrepunham.
   Agora .field é bloco, com altura garantida e valor sempre visível. */
.field{display:block;position:relative;background:#CDEFF6;border-radius:14px;padding:12px 48px 14px 12px;margin-top:12px;min-height:84px}
.field .fchip{display:inline-block;background:#ABE6F1;color:#14505C;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:8px;margin-bottom:2px}
.field input{display:block;width:100%;background:transparent;border:none;outline:none;font-size:22px;font-weight:600;color:#123B4C;line-height:1.3;padding:2px 0 0;margin:0;height:auto;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none}
.field .fsuf{position:absolute;right:16px;bottom:14px;font-size:15px;color:#7C98A6}

.volcard{margin-top:16px;background:#E4F8EE;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.volcard .drop-c{width:46px;height:46px;border-radius:50%;border:2.5px solid #14B8C9;display:flex;align-items:center;justify-content:center;color:#14B8C9;flex:none}
.volcard b{display:block;font-size:15px;font-weight:800;color:#123B4C}
.volcard .m3{display:block;font-size:25px;font-weight:800;color:#0AA8BC;letter-spacing:-.5px;margin:1px 0}
.volcard small{display:block;font-size:13px;color:#5F7385}
.presets{display:flex;gap:10px;margin-top:14px}
.preset{flex:1;padding:13px;border-radius:12px;background:#E8EDF0;color:#33475C;font-size:15px;font-weight:700}
.preset.on{background:#14B8C9;color:#fff}
.linkmode{background:none;color:#0AA8BC;font-size:13px;font-weight:700;padding:12px 0 0}
.foot-note{text-align:center;font-size:12px;color:#7C8FA0;margin:16px 18px 6px}

/* ---------- CLIMA ---------- */
.wx-big{display:flex;justify-content:center;margin-top:22px}
.wx-temp-line{text-align:center;font-size:32px;font-weight:800;color:#1B2C5E;letter-spacing:-1px;margin-top:8px}
.wx-place{text-align:center;font-size:13.5px;color:#5F7385;margin-top:4px}
.wx-extra{text-align:center;font-size:12px;color:#7C8FA0;margin-top:2px}
.slab{display:flex;gap:8px;align-items:center;margin:22px 18px 10px;color:#0E97A8;font-weight:800;letter-spacing:1.2px;font-size:13.5px;text-transform:uppercase}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:70px;background:#CDEFF7;border-radius:14px;padding:10px 6px 9px;text-align:center}
.hcard .hc-h{font-size:12px;font-weight:700;color:#22406B}
.hcard b{display:block;font-size:16.5px;font-weight:800;color:#1B2C5E;margin-top:3px}
.days{background:#fff;border-radius:18px;margin:0 16px;padding:4px 16px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.day{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EEF3F5}
.day:last-child{border-bottom:none}
.d-name{font-size:14.5px;font-weight:800;color:#1B2C5E;width:92px;flex:none}
.d-temp{font-size:14.5px;font-weight:600;color:#22406B;flex:1;white-space:nowrap}
.wbg{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
.wbg.red{background:#F45B5B;color:#fff}.wbg.or{background:#F58B2D;color:#fff}
.wbg.yl{background:#FFD54F;color:#6B4E00}.wbg.gr{background:#35B558;color:#fff}
.wx-btns{display:flex;gap:10px;margin:20px 18px 4px}
.o-btn{flex:1;padding:13px;border-radius:12px;border:2px solid #14B8C9;color:#0E97A8;font-size:15px;font-weight:800;background:#fff}
.t-btn{flex:1;padding:13px;border-radius:12px;background:#14B8C9;color:#fff;font-size:15px;font-weight:800}
.wx-foot{text-align:center;font-size:11.5px;color:#7C8FA0;margin:14px 0 4px}
.wx-load{text-align:center;padding:40px 20px}
.spinner{width:28px;height:28px;border:3.5px solid #CFE9EE;border-top-color:#14B8C9;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wx-load p{font-weight:700;font-size:14px;color:#22406B}
.wx-load small{display:block;color:#7C8FA0;margin-top:5px;font-weight:500;font-size:12px}
.offcard{margin:16px 16px 0;background:#FFF3DE;border-radius:14px;padding:13px 14px;border-left:4px solid #F08C00}
.offcard b{font-size:13px;color:#7A4A00;display:block}
.offcard button{margin-top:8px;background:#F08C00;color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* ---------- HISTÓRICO ---------- */
.ranges{background:#fff;border-radius:16px;padding:6px;display:flex;gap:8px;margin:14px 16px 0;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.ranges button{flex:1;padding:11px;border-radius:11px;border:1.5px solid #DCE6EA;background:#fff;color:#22406B;font-size:14px;font-weight:700}
.ranges button.on{background:#14B8C9;border-color:#14B8C9;color:#fff}
.analysis{margin:14px 16px 0;background:#14B8C9;border-radius:18px;padding:16px;color:#fff;display:flex;gap:14px;align-items:center}
.analysis .drop-c{width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;flex:none}
.an-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.an-grid b{font-size:16.5px;font-weight:800;letter-spacing:-.2px}
.an-grid span{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.92)}
.an-dot{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.an-upd{font-size:11px;color:rgba(255,255,255,.85);margin-top:10px;font-weight:500}
.evo-h{display:flex;align-items:center;justify-content:space-between;margin:24px 18px 10px}
.evo-h h2{font-size:21px;font-weight:800;color:#123B4C;letter-spacing:-.4px}
.evo-h button{color:#0AA8BC;font-size:14px;font-weight:700}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.chc{background:#fff;border-radius:16px;padding:13px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.chc h4{font-size:15px;font-weight:800;color:#123B4C;letter-spacing:-.2px}
.chc .trow{display:flex;align-items:center;gap:6px;margin-top:4px}
.chc .tval{font-size:21px;font-weight:800;color:#1B2C5E;letter-spacing:-.5px}
.chc .rng{font-size:11px;color:#7C8FA0;margin-top:1px}
.chc .dts{font-size:9px;color:#8FA3B0;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chc .det{font-size:10px;color:#0AA8BC;font-weight:700;margin-top:5px}
.tl-h{display:flex;align-items:center;gap:9px;margin:26px 18px 12px;color:#123B4C}
.tl-h h2{font-size:21px;font-weight:800;letter-spacing:-.4px}
.tl{margin:0 18px;position:relative}
.tl-item{position:relative;padding:0 0 20px 34px}
.tl-item::before{content:'';position:absolute;left:9px;top:20px;bottom:-2px;width:2.5px;background:#C9EBF0;border-radius:2px}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tl-dot.ok{background:#35B558}.tl-dot.warn{background:#F58B2D}.tl-dot.info{background:#2FA7E0}.tl-dot.maint{background:#9AAFB8}
.tl-date{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:8px;background:#E7EEF1;color:#22406B;margin-bottom:5px;text-transform:uppercase}
.tl-date.today{background:#14B8C9;color:#fff}
.tl-item b{display:block;font-size:14px;font-weight:700;color:#1B2C5E;line-height:1.35}
.tl-item p{font-size:12px;color:#5F7385;line-height:1.5;margin-top:3px}

/* ---------- DICAS ---------- */
.tip{background:#fff;border-radius:16px;padding:14px;display:flex;gap:13px;margin:0 16px 12px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.tip-ic{width:40px;height:40px;border-radius:12px;background:#DFF4F7;color:#0E97A8;display:flex;align-items:center;justify-content:center;flex:none}
.tip-body{flex:1}
.tip-body b{font-size:14.5px;color:#1B2C5E}
.tip-body p{font-size:12.5px;color:#5F7385;line-height:1.5;margin-top:3px}
.tip-btn{color:#0AA8BC;font-size:13px;font-weight:800;padding:8px 0 0;display:flex;align-items:center;gap:4px}

/* ---------- PLANO ---------- */
.ban{background:#E15454;color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin:14px 16px 0}
.ban b{display:block;font-size:15px}
.ban span{display:block;font-size:11.5px;color:rgba(255,255,255,.9);margin-top:3px;line-height:1.45}
.step{display:flex;gap:12px;background:#fff;border-radius:18px;padding:15px;margin:12px 16px 0;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.step-n{width:30px;height:30px;border-radius:10px;background:#14B8C9;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step>div:last-child{flex:1;min-width:0}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step-head h4{font-size:14.5px;color:#1B2C5E;letter-spacing:-.2px}
.sbdg{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.sbdg.ok{background:#DFF3D6;color:#256B2F}.sbdg.warn{background:#FFE2B0;color:#8A5200}
.sbdg.bad{background:#F8C1C1;color:#8E2020}.sbdg.later{background:#D6F1F6;color:#0E7183}
.dose{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EAF7F9;border:1.5px dashed #9ADCE6;border-radius:12px;padding:9px 12px;margin:10px 0 2px}
.dose b{font-size:12.5px;color:#123B4C;display:block}
.dose small{font-size:10.5px;color:#7C8FA0;display:block;margin-top:1px}
.dose-v{font-size:14px;font-weight:800;color:#0AA8BC;white-space:nowrap}
.inst{list-style:none;margin-top:9px}
.inst li{position:relative;padding-left:14px;font-size:11.5px;color:#5F7385;line-height:1.5;margin-top:5px}
.inst li::before{content:'';position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:#9DB8C4}
.plan-meta{margin:12px 18px 0;font-size:12px;color:#7C8FA0;font-weight:600}
.fine{font-size:11px;color:#8FA3B0;margin:14px 18px 0;line-height:1.55}
.center{text-align:center}

/* ---------- MODAIS ---------- */
.m-back{position:fixed;inset:0;background:rgba(10,30,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:80;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.m-card{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:88dvh;overflow:auto}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.m-card h3{font-size:18px;font-weight:800;color:#123B4C}
.m-card .m-p{font-size:13px;color:#5F7385;line-height:1.55;margin-top:6px}
.f-label{display:block;font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7C8FA0;margin:16px 0 6px}
.in{width:100%;padding:12px 14px;border:1.5px solid #D5E2E8;border-radius:12px;font-size:16px;font-weight:600;color:#123B4C;background:#F6FAFB;outline:none}
.in:focus{border-color:#14B8C9}
.seg{display:flex;background:#E7EEF0;border-radius:12px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:#5F7385}
.seg button.on{background:#fff;color:#0AA8BC;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.m-btn{width:100%;margin-top:16px;padding:15px;border-radius:14px;background:#14B8C9;color:#fff;font-size:15.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.m-ghost{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1.5px solid #D5E2E8;color:#5F7385;font-size:13.5px;font-weight:700}
.m-row{display:flex;gap:10px;margin-top:16px}
.m-row button{margin-top:0;flex:1}
.al-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #EEF3F5}
.al-row b{font-size:14px;color:#123B4C;display:block}
.al-row small{font-size:11.5px;color:#7C8FA0}
.sw{width:46px;height:27px;border-radius:999px;background:#D5E2E8;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:#14B8C9}
.sw.on::after{left:22px}
.mstep{background:#F1F7F9;border-radius:12px;padding:11px 13px;margin-top:9px}
.mstep b{font-size:12.5px;color:#123B4C;display:block}
.mstep span{font-size:11.5px;color:#5F7385;line-height:1.45;display:block;margin-top:2px}
.med-list{margin-top:6px}
.med-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #EEF3F5;font-size:13px}

/* ---------- lista de compras (modal) ---------- */
.shop-card{position:relative;background:#EAF9F6;width:100%;max-width:440px;margin:0 16px;border-radius:24px;padding:22px 20px 20px;max-height:88dvh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.m-back.center{align-items:center}
.shop-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#B9C6CD;color:#fff;display:flex;align-items:center;justify-content:center}
.shop-card h2{font-size:27px;font-weight:800;color:#0E7183;letter-spacing:-.6px;line-height:1.1;padding-right:36px}
.shop-card .ssub{font-size:16px;color:#6E8CA0;margin-top:2px}
.shop-bar{height:10px;border-radius:8px;background:linear-gradient(90deg,#BDEFF8,#8FE3F0);margin:16px -20px}
.shop-it{padding:15px 0;border-bottom:1px solid #D5EDEA}
.shop-cat{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:#fff;padding:4px 11px;border-radius:8px;margin-bottom:9px}
.shop-row{display:flex;gap:12px;align-items:flex-start}
.shk{width:30px;height:30px;border-radius:9px;border:3px solid #14B8C9;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;margin-top:2px}
.shk.on{color:#3DBE7C}
.shop-t{flex:1;min-width:0}
.shop-t b{display:block;font-size:16.5px;font-weight:800;color:#22384E;text-transform:uppercase;letter-spacing:-.2px}
.shop-t span{display:block;font-size:12.5px;color:#5F7385;line-height:1.5;margin-top:3px}
.shop-total{background:#CFF2F8;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.shop-total b{font-size:16px;font-weight:800;color:#123B4C}
.shop-total span{font-size:20px;font-weight:800;color:#0AA8BC}
.shop-foot{text-align:center;font-size:11.5px;color:#7C8FA0;margin-top:12px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,14px);background:#123B4C;color:#fff;padding:11px 17px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.28s;z-index:99;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:#B3540E}

<script>
/* =========================================================
   PISCINA INTELIGENTE v3.0 — PWA completo
   ========================================================= */
const $=s=>document.querySelector(s);
const f1=v=>(+v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const f0=v=>Math.round(+v).toLocaleString('pt-BR');
const fmt=v=>{const n=+v;return n%1?f1(n):f0(n);};
const round5=v=>Math.max(5,Math.round(v/5)*5);
const gW=v=>v>=1000?f1(v/1000)+' kg':round5(v)+' g';
const mlW=v=>v>=1000?f1(v/1000)+' L':round5(v)+' ml';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const ddmm=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const MSES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const dShort=d=>ddmm(d)+' '+MSES[d.getMonth()];

/* ---------- ícones ---------- */
const ICONS={
 home:'<path d="M3.5 11 12 3.5 20.5 11"/><path d="M5.5 9.8V20.5h13V9.8"/>',
 cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
 bars:'<path d="M5 20v-8M12 20V5M19 20v-6"/><path d="M3 20.5h18"/>',
 bulb:'<path d="M9.2 18h5.6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 3.6 10.8c-.7.5-1.1 1.3-1.1 2.2H9.5c0-.9-.4-1.7-1.1-2.2A6 6 0 0 1 12 3Z"/>',
 gear:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>',
 alert:'<path d="M10.3 4.4 2.6 17.6a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.4a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4M12 16.8h.01"/>',
 waves:'<path d="M3 8.5c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 6 0" transform="translate(-1.5 1.5) scale(.92)"/><path d="M3 14.5c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 6 0" transform="translate(-1.5 1.5) scale(.92)"/><path d="M3 20.5c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 6 0" transform="translate(-1.5 1.5) scale(.92)"/>',
 gem:'<path d="M7.2 4.5h9.6l3.7 4.6L12 19.8 3.5 9.1Z"/><path d="M3.5 9.1h17"/><path d="M9.6 4.5 8.3 9.1 12 19.8 15.7 9.1l-1.3-4.6"/>',
 drop:'<path d="M12 3.6S6.2 9.9 6.2 14a5.8 5.8 0 0 0 11.6 0c0-4.1-5.8-10.4-5.8-10.4Z"/>',
 check:'<path d="M4.5 12.5 10 18 19.5 7"/>',
 cal:'<rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 2.8V6.5M16 2.8V6.5"/>',
 clock:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.4 2"/>',
 info:'<circle cx="12" cy="12" r="8.8"/><path d="M12 11v5M12 7.6h.01"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 back:'<path d="M14.5 5.5 8 12l6.5 6.5"/>',
 download:'<path d="M12 4v10.5"/><path d="M7.8 10.8 12 15l4.2-4.2"/><path d="M4.5 19.5h15"/>',
 save:'<path d="M5.5 4.5h10.4l2.6 2.6v12.4h-13Z"/><path d="M8.5 4.5v4.6h7V4.5"/><path d="M8.5 13.5h7v6"/>',
 snow:'<path d="M12 3.5v17M4.6 7.8l14.8 8.4M19.4 7.8 4.6 16.2"/>',
 refresh:'<path d="M20.5 11A8.5 8.5 0 0 0 6.8 5.9L4.5 8.1"/><path d="M4.5 3.5v4.6h4.6"/><path d="M3.5 13a8.5 8.5 0 0 0 13.7 4.9l2.3-2.2"/><path d="M19.5 20.5v-4.6h-4.6"/>',
 pencil:'<path d="M16.8 3.7a2.6 2.6 0 0 1 3.7 3.7L7.6 20.3 2.8 21.5l1.2-4.8Z"/>',
 umbrella:'<path d="M12 3a9 9 0 0 1 9 9.5H3A9 9 0 0 1 12 3Z"/><path d="M12 12.5v6a2 2 0 0 0 4 0"/>',
 wrench:'<path d="M14.3 6.8a3.9 3.9 0 0 0-5.4 4.9L4 16.6 7.4 20l4.9-4.9a3.9 3.9 0 0 0 4.9-5.4L14.6 12 12 9.4Z"/>',
 zap:'<path d="M13 2.5 4.5 13.5h6l-1.5 8 8.5-11h-6l1.5-8Z"/>',
 sparkle:'<path d="M12 4.5 13.5 9 18 10.5 13.5 12 12 16.5 10.5 12 6 10.5 10.5 9Z"/>',
 shieldA:'<path d="M12 2.8 4.8 5.6v5.2c0 4.6 3.1 8.1 7.2 9.7 4.1-1.6 7.2-5.1 7.2-9.7V5.6Z"/><path d="M12 8v4M12 15.2h.01"/>'
};
const icon=(n,s=18)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';
function pillSparkle(s=22){return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
 +'<g transform="rotate(-35 11 13)"><rect x="2.6" y="9.7" width="16.8" height="6.6" rx="3.3"/><path d="M11 9.7v6.6"/></g>'
 +'<path d="M20.5 3.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z" fill="#fff" stroke="none"/></svg>';}

/* ---------- ícones de clima preenchidos ---------- */
const CLOUDP='M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z';
function wDrop(x,y,s){return '<path transform="translate('+x+' '+y+') scale('+s+')" fill="#4FA8E0" d="M0 0C1.2 1.6 1.9 2.8 1.9 3.7 1.9 4.9 1 5.7 0 5.7S-1.9 4.9-1.9 3.7C-1.9 2.8-1.2 1.6 0 0Z"/>';}
function wSun(cx,cy,r){let g='<g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#FFC53D"/>';
 for(let a=0;a<8;a++){const t=a*Math.PI/4;
  g+='<line x1="'+(cx+Math.cos(t)*(r+1.6)).toFixed(2)+'" y1="'+(cy+Math.sin(t)*(r+1.6)).toFixed(2)+'" x2="'+(cx+Math.cos(t)*(r+3)).toFixed(2)+'" y2="'+(cy+Math.sin(t)*(r+3)).toFixed(2)+'" stroke="#FFC53D" stroke-width="1.7" stroke-linecap="round"/>';}
 return g+'</g>';}
function wCloud(fill,tf){return '<g transform="'+tf+'"><path d="'+CLOUDP+'" fill="'+fill+'"/></g>';}
function bigWx(code,s=28){
 let inner;
 if(code===0)inner=wSun(12,12,4.4);
 else if(code===1||code===2)inner=wSun(16.5,7.5,3.1)+wCloud('#93A6B8','translate(-2 3.2) scale(.8)');
 else if(code===3||code===45||code===48)inner=wCloud('#93A6B8','translate(0 1.4) scale(.94)');
 else if(code>=51&&code<=57)inner=wCloud('#5A7396','translate(1 -1) scale(.8)')+wDrop(8.6,17.6,.9)+wDrop(13.4,19.2,.9);
 else if(code>=61&&code<=67||code>=80&&code<=82)inner=wCloud('#3E5578','translate(1 -2.4) scale(.8)')+wDrop(7.6,17,.85)+wDrop(12.2,19,.85)+wDrop(16.6,17,.85);
 else if(code>=71&&code<=77||code===85||code===86)inner=wCloud('#5A7396','translate(1 -2.4) scale(.8)')+'<g fill="#B9D9E8"><circle cx="8.8" cy="19" r="1.2"/><circle cx="12.4" cy="20.6" r="1.2"/><circle cx="15.6" cy="18.6" r="1.2"/></g>';
 else if(code>=95)inner=wCloud('#1F2E56','translate(1 -2.6) scale(.8)')
   +wDrop(6.8,17.4,.8)+wDrop(16.8,17.4,.8)
   +'<path d="M13.6 12.6 9.2 19h2.7l-1.2 4.2 5.2-6.6h-2.9l1.7-4Z" fill="#FFC53D"/>';
 else inner=wCloud('#93A6B8','translate(0 1.4) scale(.94)');
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" aria-hidden="true">'+inner+'</svg>';
}
function describeCode(c){
 if(c===0)return'Céu limpo';if(c===1)return'Predomínio de sol';if(c===2)return'Parcialmente nublado';if(c===3)return'Nublado';
 if(c===45||c===48)return'Neblina';if(c>=51&&c<=57)return'Garoa';
 if(c===61)return'Chuva fraca';if(c===63)return'Chuva';if(c===65)return'Chuva forte';
 if(c>=71&&c<=77)return'Neve';if(c===80||c===81)return'Pancadas de chuva';if(c===82)return'Pancadas fortes';
 if(c>=96)return'Tempestade com granizo';if(c>=95)return'Tempestade';return'—';
}
function dayBadge(code){
 if(code>=95||code===65||code===82)return{cls:'red',txt:'Evitar'};
 if(code===63||code===80||code===81||code===66||code===67)return{cls:'or',txt:'Cuidado'};
 if(code>=51&&code<=61||code===3)return{cls:'yl',txt:'Atenção'};
 if(code===1||code===2||code===45||code===48)return{cls:'gr',txt:'Baixo risco'};
 return{cls:'gr',txt:'Seguro para abrir'};
}

/* ---------- estado (localStorage poolcare_v1) ---------- */
const PLACE='Cachoeira do Campo - MG',LAT=-20.3848,LON=-43.6741;
const SHAPES={rect:{label:'Retangular',f:1},round:{label:'Redonda',f:0.785},oval:{label:'Oval',f:0.85},oct:{label:'Oitavada',f:0.87}};
const RANGES={
 ph:{label:'pH',dec:1,lo:7.2,hi:7.6,unit:''},
 cl:{label:'Cloro',dec:1,lo:1,hi:3,unit:' mg/L'},
 alk:{label:'Alcalinidade',dec:0,lo:80,hi:120,unit:' mg/L'},
 hard:{label:'Dureza',dec:0,lo:200,hi:400,unit:' mg/L'}
};
function lab(i){const t=new Date();t.setDate(t.getDate()-i);return t;}
function defaultState(){return{
 view:'home',
 cfg:{shape:'rect',length:9,width:4,shallow:1.0,deep:1.5,liters:45000,litersMode:'calc'},
 water:'cristalina',
 readings:{ph:7.6,cl:0,alk:80,hard:200},
 hist:{
  ph:[{v:7.2,d:ddmm(lab(14))},{v:7.2,d:ddmm(lab(9))},{v:7.6,d:ddmm(lab(4))},{v:7.6,d:ddmm(lab(0))}],
  cl:[{v:0.5,d:ddmm(lab(14))},{v:0.5,d:ddmm(lab(9))},{v:5.0,d:ddmm(lab(4))},{v:0.0,d:ddmm(lab(0))}],
  alk:[{v:60,d:ddmm(lab(14))},{v:70,d:ddmm(lab(9))},{v:80,d:ddmm(lab(4))},{v:80,d:ddmm(lab(0))}],
  hard:[{v:180,d:ddmm(lab(14))},{v:190,d:ddmm(lab(9))},{v:200,d:ddmm(lab(4))},{v:200,d:ddmm(lab(0))}]
 },
 events:[],
 histRange:'30',details:false,
 weather:null,wxLoading:false,
 alerts:{storm:true,cloro:true},
 shopChecks:{}
};}
let state=defaultState();
function seedEvents(){
 state.events=[
  {type:'warn',d:lab(2),title:'Técnico adicionou cloro e ajustou o pH',desc:'Dosagem de cloro aplicada. pH ajustado para baixo após medição.'},
  {type:'info',d:lab(4),title:'pH 7,8 • Cloro 0,0 — Alerta: pH alto detectado',desc:'Recomendação: aplicar redutor de pH para corrigir.'},
  {type:'maint',d:lab(6),title:'Manutenção realizada',desc:'Limpeza do filtro e coleta de amostra para análise.'}
 ];
}
function loadState(){
 try{
  const raw=localStorage.getItem('poolcare_v1');if(!raw)return;
  const j=JSON.parse(raw);
  if(j.cfg)Object.assign(state.cfg,j.cfg);
  if(j.readings)Object.assign(state.readings,j.readings);
  if(j.hist)['ph','cl','alk','hard'].forEach(k=>{if(Array.isArray(j.hist[k])&&j.hist[k].length)state.hist[k]=j.hist[k];});
  if(j.water)state.water=j.water;
  if(j.alerts)Object.assign(state.alerts,j.alerts);
 }catch(e){}
}
function persist(){try{localStorage.setItem('poolcare_v1',JSON.stringify({cfg:state.cfg,readings:state.readings,hist:state.hist,water:state.water,alerts:state.alerts}));}catch(e){}}

/* ---------- litragem ---------- */
function calcLiters(c){
 const f=SHAPES[c.shape].f,depth=((+c.shallow)+(+c.deep))/2;
 const area=c.shape==='round'?Math.pow(+c.length,2):(+c.length)*(+c.width);
 return Math.round(depth*area*f*1000/100)*100;
}
const litersOf=()=>state.cfg.litersMode==='direct'?(+state.cfg.liters||0):calcLiters(state.cfg);
const m3=L=>(L/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' m³';

/* ---------- problemas / dicas ---------- */
function statOf(k,v){const r=RANGES[k];return(v>=r.lo&&v<=r.hi)?{cls:'ok',txt:'Ideal'}:{cls:'warn',txt:v<r.lo?'Baixo':'Alto'};}
function problems(){
 const r=state.readings,p=[];
 if(r.ph<7.2||r.ph>7.6)p.push({k:'ph',hi:r.ph>7.6});
 if(r.cl<1)p.push({k:'cl',lo:true});else if(r.cl>3)p.push({k:'cl'});
 if(r.alk<80||r.alk>120)p.push({k:'alk',hi:r.alk>120});
 if(r.hard<200||r.hard>400)p.push({k:'hard',hi:r.hard>400});
 if(state.water==='verde')p.push({k:'agua'});
 return p;
}
function problemBanner(){
 const ps=problems();
 if(!ps.length)return{grn:true,t:'Tudo em ordem',p:'Todos os parâmetros estão dentro das faixas ideais. Mantenha a rotina de manutenção semanal.'};
 const first=ps[0];let t='',p='';
 if(first.k==='cl'&&first.lo){t='Atenção: Cloro baixo';p='O nível de cloro está abaixo do recomendado (1,0–3,0 ppm). Recomendamos dosar agora para manter a água segura.';}
 else if(first.k==='cl'){t='Atenção: Cloro alto';p='O nível de cloro está acima do recomendado (1,0–3,0 ppm). Suspenda a dosagem e re-meça em 24 h.';}
 else if(first.k==='ph'){t='Atenção: pH '+(first.hi?'alto':'baixo');p='O pH está fora do recomendado (7,2–7,6). Corrija primeiro o pH — ele afeta todos os outros parâmetros.';}
 else if(first.k==='alk'){t='Atenção: Alcalinidade '+(first.hi?'alta':'baixa');p='A alcalinidade está fora do ideal (80–120 mg/L). Ajuste com barrilha ou redutor de pH.';}
 else if(first.k==='hard'){t='Atenção: Dureza '+(first.hi?'alta':'baixa');p='A dureza está fora do ideal (200–400 mg/L). Corrija em outro dia do choque de cloro.';}
 else{t='Atenção: Água verde';p='Algas instaladas. Será necessário choque duplo, escovação e filtração por 24 h.';}
 if(ps.length>1)p+=' Há '+ps.length+' pontos fora do ideal no total.';
 return{t,p};
}
function poolVerdict(){
 const w=state.weather;if(!w)return null;
 const c=w.current.code,pop=w.daily[0].pop;
 if(c>=95||c===65||c===82)return{cls:'bad',t:'Tempestade',d:'Cubra a piscina, suspenda a dosagem e re-meça o cloro depois da chuva.'};
 if(c>=60||pop>=60)return{cls:'warn',t:'Chuva no radar',d:'Cubra a piscina hoje; chuva dilui o cloro — re-meça amanhã cedo.'};
 return{cls:'ok',t:'Condições ótimas',d:'Dia perfeito para dosar produtos e deixar o filtro trabalhando.'};
}
function dicasHoje(){
 const r=state.readings,list=[],vd=poolVerdict();
 if(r.cl<1)list.push({ic:'zap',t:'Reativação da piscina',p:'Com cloro em '+f1(r.cl)+', a água parou de ser desinfetada. Um choque noturno traz a piscina de volta hoje.',cta:'Resolver agora'});
 if(state.water==='verde')list.push({ic:'drop',t:'Água verde',p:'Algas instaladas: choque duplo, escovação e filtro 24 h. Banho proibido até clarear.'});
 if(vd&&vd.cls!=='ok')list.push({ic:'umbrella',t:'Tempestade no radar',p:'Cubra a piscina e adie qualquer dosagem para o próximo dia firme.'});
 list.push({ic:'pencil',t:'Limpeza de borda',p:'Aplique limpa borda nas paredes a cada 15 dias para evitar linha amarelada na superfície.'});
 list.push({ic:'sparkle',t:'Manutenção semanal',p:'Peneire a superfície, escove as paredes e mantenha o filtro ligado 6 h por dia.'});
 return list;
}

/* ---------- navegação ---------- */
function go(v){state.view=v;render();window.scrollTo(0,0);}
function render(){
 const v=state.view;
 $('#app').innerHTML=v==='home'?vHome():v==='clima'?vClima():v==='hist'?vHist():v==='dicas'?vDicas():v==='config'?vConfig():vPlano();
 document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}

/* ============================ HOME ============================ */

/* ============================ CLIMA (blindado) ============================ */
function fetchT(url,ms){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
 return fetch(url,{signal:ctl.signal}).finally(()=>clearTimeout(t));}
async function fetchForecast(){
 const url='https://api.open-meteo.com/v1/forecast?latitude='+LAT+'&longitude='+LON
 +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'
 +'&hourly=temperature_2m,precipitation_probability,weather_code'
 +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
 +'&forecast_days=7&timezone=auto';
 try{
  const res=await fetchT(url,7000);
  if(!res.ok)return null;
  const j=await res.json();
  let idx=j.hourly.time.findIndex(t=>new Date(t).getTime()>=Date.now()-36e5);if(idx<0)idx=0;
  return{simulated:false,place:PLACE,at:new Date(),
   current:{temp:Math.round(j.current.temperature_2m),feels:Math.round(j.current.apparent_temperature),
    code:j.current.weather_code,wind:Math.round(j.current.wind_speed_10m),hum:j.current.relative_humidity_2m},
   hourly:j.hourly.time.slice(idx,idx+12).map((t,i)=>({label:i===0?'Agora':new Date(t).getHours()+'h',
    temp:Math.round(j.hourly.temperature_2m[idx+i]),pop:(j.hourly.precipitation_probability[idx+i]??0),code:j.hourly.weather_code[idx+i]})),
   daily:j.daily.time.map((t,i)=>{const d=new Date(t+'T12:00');
    return{label:i===0?'Hoje, '+ddmm(d):DOW[d.getDay()]+', '+ddmm(d),
     min:Math.round(j.daily.temperature_2m_min[i]),max:Math.round(j.daily.temperature_2m_max[i]),
     pop:(j.daily.precipitation_probability_max[i]??0),code:j.daily.weather_code[i]};})};
 }catch(e){return null;}
}
function simulateForecast(){
 const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
 const base=new Date();const hours=[],days=[];
 for(let i=0;i<12;i++)hours.push({label:i===0?'Agora':((base.getHours()+i)%24)+'h',temp:27+ri(-3,3),pop:Math.max(5,80-i*ri(3,9)),code:pick([80,95,63,95])});
 for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);
  const mn=ri(18,21);
  days.push({label:i===0?'Hoje, '+ddmm(d):DOW[d.getDay()]+', '+ddmm(d),min:mn,max:mn+ri(6,11),pop:ri(5,90),code:pick([0,1,2,3,61,80,95,95])});}
 return{simulated:true,place:PLACE,at:new Date(),
  current:{temp:27,feels:29,code:95,wind:15,hum:87},hourly:hours,daily:days};
}
function loadWeather(){
 state.wxLoading=true;render();
 let done=false;
 const wd=setTimeout(()=>{if(done)return;done=true;state.wxLoading=false;state.weather=simulateForecast();render();toast('Sem resposta do clima — previsão simulada carregada.','warn');},8000);
 fetchForecast().then(f=>{
  if(done)return;done=true;clearTimeout(wd);
  state.wxLoading=false;state.weather=f||simulateForecast();render();
 });
}

 return null;
}

/* ============================ HISTÓRICO ============================ */
function smoothChart(pts){
 const W=300,H=64,iw=W-8;
 const vals=pts.map(p=>p.v);
 const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
 const pad=(hi-lo)*0.25||0.6,yMin=lo-pad,yMax=hi+pad;
 const X=i=>4+iw*i/Math.max(1,pts.length-1);
 const Y=v=>6+(H-14)*(1-(v-yMin)/(yMax-yMin));
 const P=vals.map((v,i)=>({x:X(i),y:Y(v)}));
 let d='M'+P[0].x.toFixed(1)+' '+P[0].y.toFixed(1);
 for(let i=1;i<P.length;i++){const xc=((P[i-1].x+P[i].x)/2).toFixed(1),yc=((P[i-1].y+P[i].y)/2).toFixed(1);
  d+=' Q'+P[i-1].x.toFixed(1)+' '+P[i-1].y.toFixed(1)+' '+xc+' '+yc;}
 d+=' L'+P[P.length-1].x.toFixed(1)+' '+P[P.length-1].y.toFixed(1);
 const area=d+' L'+P[P.length-1].x.toFixed(1)+' '+H+' L'+P[0].x.toFixed(1)+' '+H+' Z';
 const last=P[P.length-1];
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:6px" aria-hidden="true">'
  +'<path d="'+area+'" fill="#DDF3F7"/>'
  +'<path d="'+d+'" fill="none" stroke="#22B6CB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
  +'<circle cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="3.6" fill="#14B8C9" stroke="#fff" stroke-width="1.6"/></svg>';
}
function trendArrow(pts){
 const up=pts[pts.length-1].v>=pts[0].v;
 const p=up?'<path d="M3 10 8 5l3 3 5-5"/><path d="M12 3h4v4"/>':'<path d="M3 4l5 5 3-3 5 5"/><path d="M12 11h4V7"/>';
 return '<svg width="17" height="15" viewBox="0 0 17 14" fill="none" stroke="'+(up?'#35B558':'#F58B2D')+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

function shapeSvg(k){
 const s='<svg width="36" height="30" viewBox="0 0 36 30" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true">';
 if(k==='rect')return s+'<rect x="4" y="7" width="28" height="16" rx="2.5"/></svg>';
 if(k==='round')return s+'<circle cx="18" cy="15" r="10.5"/></svg>';
 if(k==='oval')return s+'<ellipse cx="18" cy="15" rx="12" ry="8" transform="rotate(-18 18 15)"/></svg>';
 return s+'<path d="M12 5h12l7 7v6l-7 7H12l-7-7v-6Z" stroke-linejoin="round"/></svg>';
}
function activePreset(){
 const c=state.cfg,near=(a,b)=>Math.abs(a-b)<0.05;
 for(const k in PRESETS){const p=PRESETS[k];
  if(near(+c.length,p.l)&&near(+c.width,p.w)&&near(+c.shallow,p.sh)&&near(+c.deep,p.dp))return k;}
 return null;
}

 +'<p class="foot-note">O volume é calculado automaticamente com base nas dimensões</p>'
 +'<button class="m-ghost" style="margin:6px 18px 0;width:calc(100% - 36px);color:#C6393F;border-color:#F0C9C9" onclick="askReset()">Apagar dados salvos</button>'
 +'</div>';
 return h;
}

/* ============================ PLANO ============================ */
function gerarPlanoCompleto(){
 const L=litersOf(),k=L/1000,r=state.readings,verde=state.water==='verde',turva=state.water==='turva';
 const FATOR={choqueSimples14:14,choqueDuplo28:28,sulfato10:10,clarificante2:2,algicidaChoque6:6};
 const etapas=[],compras=[];
 const addB=(cat,name,desc,qty,price)=>compras.push({cat,name,desc,qty,price});
 const banho=r.cl<1||verde;

 /* 1 pH */
 if(r.ph>7.6){const ml=round5((r.ph-7.6)*10*4*k);
  etapas.push({t:'pH da água',bdg:['warn','Ajustar'],prod:'Redutor de pH (ácido muriático)',chem:'aplique antes de tudo — o pH manda no resto',dose:mlW(ml),
   inst:['Filtro ligado e ninguém na água: aplique 1/3 da dose caminhando na borda.','Espere 4 h, meça de novo e complete o restante se precisar.']});
  addB('limpeza','REDUTOR DE PH','ácido muriático — corrige pH acima de 7,6',mlW(ml),ml/1000*7.90);}
 else if(r.ph<7.2){const g=round5((7.2-r.ph)*10*18*k);
  etapas.push({t:'pH da água',bdg:['warn','Ajustar'],prod:'Elevador de pH (barrilha)',chem:'carbonato de sódio',dose:gW(g),
   inst:['Dilua a dose em um balde com água da própria piscina e distribua com o filtro ligado.','Meça o pH novamente após 4–6 h.']});
  addB('limpeza','BARRILHA (ELEVADOR DE PH)','carbonato de sódio — sobe o pH',gW(g),g/1000*4.80);}
 else etapas.push({t:'pH da água',bdg:['ok','Em ordem'],inst:['pH '+f1(r.ph)+' dentro da faixa 7,2–7,6. Reavalie após cada etapa.']});

 /* 2 AT */
 if(r.alk<80){const g=round5(((80-r.alk)/10)*18*k);
  etapas.push({t:'Alcalinidade (AT)',bdg:['warn','Ajustar'],prod:'Barrilha',chem:'carbonato de sódio — sobe a AT',dose:gW(g),
   inst:['Aplique com o filtro ligado e re-meça a AT em 6 h.','Barrilha sobe o pH junto: confira o pH depois desta etapa.']});
  addB('limpeza','BARRILHA','carbonato de sódio — eleva a alcalinidade',gW(g),g/1000*4.80);}
 else if(r.alk>120){const ml=round5(((r.alk-120)/10)*10*k);
  etapas.push({t:'Alcalinidade (AT)',bdg:['warn','Ajustar'],prod:'Redutor de pH (ácido muriático)',chem:'também derruba a AT',dose:mlW(ml),
   inst:['Dosifique aos poucos, com filtro ligado.','Re-meça após 6 h de filtração.']});
  addB('limpeza','REDUTOR DE PH','ácido muriático — pH e alcalinidade',mlW(ml),ml/1000*7.90);}
 else etapas.push({t:'Alcalinidade (AT)',bdg:['ok','Em ordem'],inst:['AT em '+f0(r.alk)+' mg/L, dentro da faixa 80–120. A AT estabiliza o pH.']});

 /* 3 Cloro */
 if(r.cl<1){
  const g=verde?FATOR.choqueDuplo28*k:FATOR.choqueSimples14*k;
  etapas.push({t:verde?'Cloro — choque duplo':'Cloro — choque simples',bdg:['bad','Choque'],
   prod:'Cloro granulado 65%',chem:'hipoclorito de cálcio',dose:gW(g)+(verde?' • 2× '+gW(g/2):''),
   inst:['Aplique ao anoitecer, com filtro ligado — o sol queima o cloro livre.','Meça de novo em 12–24 h e só libere o banho entre 1 e 3 ppm.',verde?'Água verde: repita a dose em 24 h se continuar esverdeada.':'Dissolva em balde e distribua; escove as paredes antes.']});
  addB('limpeza','CLORO GRANULADO 65%','hipoclorito de cálcio — choque '+(verde?'duplo':'simples'),gW(g),g/1000*16.90);
 }else if(r.cl>3){
  etapas.push({t:'Cloro',bdg:['warn','Aguardar'],inst:['Cloro em '+f1(r.cl)+' ppm: suspenda a dosagem, retire a capa e deixe o sol agir.','Meça amanhã — banho liberado entre 1 e 3 ppm.']});
 }else{const g=round5(3*k);
  etapas.push({t:'Cloro',bdg:['ok','Em ordem'],inst:['Cloro em '+f1(r.cl)+' ppm. Manutenção diária: '+gW(g)+' de cloro, de preferência à noite.']});
  addB('limpeza','CLORO ESTABILIZADO','manutenção diária',gW(g),g/1000*14.50);}

 /* 4 Dureza — outro dia */
 if(r.hard<200){const kg=Math.max(1,Math.round(((200-r.hard)/10)*0.85*(L/10000)*10)/10);
  etapas.push({t:'Dureza cálcica',bdg:['later','Outro dia'],prod:'Cloreto de cálcio',chem:'elevador de dureza',dose:f1(kg)+' kg',
   inst:['Etapa para outro dia: nunca misture com o dia do choque de cloro.','Espalhe o produto com o filtro ligado e filtre 8 h.']});
  addB('dureza','ELEVADOR DE DUREZA 4KG','produto para elevar a dureza da água',f1(kg)+' kg',Math.ceil(kg/4)*52.90);}
 else if(r.hard>400){
  etapas.push({t:'Dureza cálcica',bdg:['later','Outro dia'],prod:'Rebosamento',chem:'sem produto químico',dose:f0(L*0.25)+' L',
   inst:['Drene cerca de 25% do volume ('+f0(L*0.25)+' L) e complete com água nova.','Meça de novo antes de qualquer química.']});
  addB('dureza','ÁGUA NOVA PARA REBOSAMENTO','drenar 25% e completar',f0(L*0.25)+' L',null);}
 else{etapas.push({t:'Dureza cálcica',bdg:['later','Outro dia'],inst:['Dureza em '+f0(r.hard)+' mg/L, dentro da faixa 200–400. Mantenha cloreto de cálcio em estoque.']});
  addB('dureza','CLORETO DE CÁLCIO','reposição de estoque — dureza em ordem','—',null);}

 /* 5 Aparência */
 if(verde){const al=round5(FATOR.algicidaChoque6*k),cl=round5(FATOR.clarificante2*k);
  etapas.push({t:'Água verde — aparência',bdg:['bad','Tratar'],prod:'Algicida de choque + clarificante',chem:'aplicar depois do choque de cloro',dose:mlW(al)+' + '+mlW(cl),
   inst:['Escove paredes e fundo antes de aplicar o algicida de choque.','Filtro por 24 h ininterruptas; aspire o sedimento no dia seguinte.','Complete com clarificante e mantenha o filtro rodando.']});
  addB('agua','ALGICIDA DE CHOQUE','quaternário de amônio — combate algas',mlW(al),al/1000*22.50);
  addB('agua','CLARIFICANTE','polímero concentrado — água turva',mlW(cl),cl/1000*18.90);
 }else if(turva){const su=round5(FATOR.sulfato10*k),cl=round5(FATOR.clarificante2*k);
  etapas.push({t:'Água turva — aparência',bdg:['warn','Tratar'],prod:'Sulfato de alumínio + clarificante',chem:'floculante',dose:gW(su)+' + '+mlW(cl),
   inst:['Filtro em "recircular": aplique o sulfato e recircule 30 min.','Desligue o filtro por 12 h, aspire o fundo e volte para "filtrar".','Complete com clarificante e filtre 24 h.']});
  addB('agua','SULFATO DE ALUMÍNIO','floculante — decanta a água turva',gW(su),su/1000*6.50);
  addB('agua','CLARIFICANTE','polímero concentrado',mlW(cl),cl/1000*18.90);
 }else{const cl=round5(1*k);
  etapas.push({t:'Aparência da água',bdg:['ok','Em ordem'],inst:['Água '+state.water+'. Peneire a superfície, escove as paredes e mantenha 6 h/dia de filtração.','Clarificante de manutenção a cada 15 dias ('+mlW(cl)+').']});
  addB('agua','CLARIFICANTE','polímero — manutenção quinzenal',mlW(cl),cl/1000*18.90);}

 /* itens fixos */
 addB('limpeza','LIMPA BORDA 1L','limpeza de borda da piscina','1 L',24.90);
 addB('limpeza','FITAS TESTE 3 EM 1','pH, cloro e alcalinidade','1 cart.',39.90);
 addB('limpeza','PENEIRA + ESCOVA DE FUNDO','kit de limpeza manual','1 un.',89.90);

 return{L,k,FATOR,etapas,compras,banho};
}
function vPlano(){
 const p=gerarPlanoCompleto();
 let h='<header class="thdr"><button class="t-btn" onclick="go(\'home\')" aria-label="Voltar">'+icon('back',22)+'</button>'
  +'<h1>Meu Plano de Correção</h1><span></span></header><div class="page">'
 +'<p class="plan-meta">5 etapas • '+f0(p.L)+' L • siga a ordem 1 a 5</p>';
 if(p.banho)h+='<div class="ban">'+icon('shieldA',22)+'<div><b>BANHO PROIBIDO por 24 h</b>'
  +'<span>'+(state.water==='verde'?'Água verde e cloro em '+f1(state.readings.cl)+' ppm:':'Cloro em '+f1(state.readings.cl)+' ppm:')+' ninguém entra até o choque assentar e o cloro voltar para 1–3 ppm.</span></div></div>';
 p.etapas.forEach((e,i)=>{
  h+='<section class="step"><div class="step-n">'+(i+1)+'</div><div>'
   +'<div class="step-head"><h4>'+e.t+'</h4><span class="sbdg '+e.bdg[0]+'">'+e.bdg[1]+'</span></div>'
   +(e.prod?'<div class="dose"><div><b>'+e.prod+'</b>'+(e.chem?'<small>'+e.chem+'</small>':'')+'</div><span class="dose-v">'+e.dose+'</span></div>':'')
   +'<ul class="inst">'+e.inst.map(x=>'<li>'+x+'</li>').join('')+'</ul></div></section>';
 });
 h+='<button class="bigbtn" onclick="openShopModal()">'+icon('download',22)+' Lista de compras</button>'
 +'<p class="fine">Doses calculadas pelos fatores do app (choque simples '+p.FATOR.choqueSimples14+' g/1.000 L • duplo '+p.FATOR.choqueDuplo28+' g • sulfato '+p.FATOR.sulfato10+' g • clarificante '+p.FATOR.clarificante2+' ml • algicida choque '+p.FATOR.algicidaChoque6+' ml). Confirme o rótulo do fabricante e meça após cada etapa.</p></div>';
 return h;
}
