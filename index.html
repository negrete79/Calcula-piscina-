<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8FA8">
<title>Piscina Inteligente — Dosagem Guiada</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piscina App">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,'Segoe UI',sans-serif;background:#D9E2E8;color:#1B2C5E;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
.ic{display:inline-block;vertical-align:middle;flex:none}
#app{max-width:430px;margin:0 auto;background:#EFF6F8;min-height:100dvh;position:relative;padding-bottom:92px;box-shadow:0 0 44px rgba(20,40,70,.15)}
.page{padding-bottom:10px}

/* cabeçalhos */
.hdr{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;padding:20px 18px 6px}
.hdr .h-side{font-size:16px;font-weight:600;color:#7C8FA0}
.hdr h1{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.3px}
.hdr .h-btn{justify-self:end;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.thdr{background:#0B8FA8;color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:16px 10px}
.thdr h1{font-size:19px;font-weight:800;text-align:center;line-height:1.25}
.thdr .t-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.thdr .t-btn:active{background:rgba(255,255,255,.18)}
.lhdr{background:#DFF2F2;padding:14px 12px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.lhdr h1{font-size:19px;font-weight:800;text-align:center;color:#0E4A5A}
.lhdr .l-btn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#0E4A5A}

/* hero */
.hero{margin:10px 16px 0;background:linear-gradient(105deg,#35C4B5 0%,#0B8FA8 100%);border-radius:22px;padding:24px 20px 30px;position:relative;overflow:hidden;display:flex;gap:14px;align-items:center;box-shadow:0 14px 30px -14px rgba(11,143,168,.55)}
.hero-l{flex:none;position:relative;z-index:1}
.hero-r{flex:1;min-width:0;position:relative;z-index:1}
.hero-lit{font-size:32px;font-weight:800;color:#fff;letter-spacing:-.6px;line-height:1.1}
.hero-shape{font-size:16px;font-weight:600;color:rgba(255,255,255,.95);margin-top:2px}
.hero-pill{margin-top:14px;display:flex;gap:9px;align-items:center;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);border-radius:13px;padding:8px 11px}
.hero-pill small{display:block;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.9)}
.hero-pill b{display:block;font-size:12.5px;font-weight:700;color:#fff;margin-top:1px}
.waves{position:absolute;bottom:-2px;left:0;width:100%;height:44px;pointer-events:none}

/* status água */
.sec{font-size:23px;font-weight:800;margin:24px 18px 12px;letter-spacing:-.4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.stat{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 6px rgba(20,40,70,.05),0 12px 26px -18px rgba(20,40,70,.25);text-align:left}
.stat-top{display:flex;align-items:center;gap:10px}
.stat-label{font-size:14.5px;font-weight:600;color:#22406B}
.c-ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.c-ic.ph{background:#DFF3D6;color:#4E9E4E;font-size:13.5px;font-weight:800}
.c-ic.ocl{background:#FF9D2E}.c-ic.obl{background:#2FA7E0}
.stat-val{font-size:32px;font-weight:800;letter-spacing:-1px;margin:8px 0 8px 2px;display:block}
.stat-badges{display:flex;align-items:center;gap:6px;margin-left:2px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:800;padding:5px 10px;border-radius:10px}
.bdg.ok{background:#C0E8B8;color:#256B2F}
.bdg.warn{background:#FFB55C;color:#7A3E00}
.bdg.bad{background:#F8C1C1;color:#8E2020}
.unit{font-size:12px;color:#7C8FA0;font-weight:600}

/* banners e botões */
.banner{margin:16px 16px 0;background:#FFE2B0;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:calc(100% - 32px)}
.banner.grn{background:#D6F2D9}
.banner.red{background:#FBE3E3;border:1.5px solid #F0B9B9}
.banner .b-ic{width:34px;height:34px;border-radius:50%;background:#F08C00;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.banner.grn .b-ic{background:#2FA35A}
.banner.red .b-ic{background:#D64545}
.banner b{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px}
.banner p{font-size:12.5px;color:#6B5636;line-height:1.5;margin-top:3px}
.banner.grn p{color:#33604A}
.banner.red b{color:#8E2020}
.banner.red p{color:#9C4A4E}
.p-link{background:none;color:#C6393F;font-size:13px;font-weight:800;padding:8px 0 0;display:flex;align-items:center;gap:4px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:16px 16px 0;padding:16px;border-radius:14px;background:#0B8FA8;color:#fff;font-size:18px;font-weight:800;box-shadow:0 12px 24px -10px rgba(11,143,168,.6)}
.bigbtn:active{transform:scale(.985)}

/* PWA CARD */
#pwaCard{display:none}
.install{background:#5E3D9C;color:#fff;display:flex;align-items:center;gap:13px;margin:16px 16px 0;border-radius:18px;padding:14px}
.i-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.i-txt{flex:1}
.i-txt b{display:block;font-size:14px}
.i-txt span{display:block;font-size:11.5px;color:rgba(255,255,255,.82);margin-top:2px;line-height:1.45}
.install button{background:#fff;color:#5E3D9C;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:800}

/* tabbar (NÃO MEXER) */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50;border-top:1px solid #E5EDF1}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:#8A9BAA;padding:4px 0}
.tabbar button.on{color:#0B8FA8;font-weight:700}

/* CONFIG */
.csec{padding:0 18px}
.csec h2{font-size:22px;font-weight:800;color:#0E4A5A}
.csec .sub{font-size:14px;color:#5F7385;margin-top:2px}
.fmt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
.fmt{position:relative;border:1.5px solid #D8E2E8;border-radius:16px;background:#fff;padding:13px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;color:#33475C}
.fmt span{font-size:11px;font-weight:600}
.fmt.on{border:2px solid #0B8FA8;background:#DDF3F8;color:#0B8FA8}
.fmt .chk{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#0B8FA8;color:#fff;display:none;align-items:center;justify-content:center;border:2.5px solid #EFF6F8}
.fmt.on .chk{display:flex}
.divider{height:1px;background:#E2EBF0;margin:20px 18px}
/* ★ NOVO: chips de revestimento */
.rev-chips{display:flex;gap:10px;margin-top:14px}
.rev-chips button{flex:1;padding:12px;border-radius:12px;background:#E8EDF0;color:#33475C;font-size:14px;font-weight:700}
.rev-chips button.on{background:#0B8FA8;color:#fff}
.field{display:block;position:relative;background:#C9EBF2;border-radius:14px;padding:12px 46px 14px 12px;margin-top:12px;min-height:82px}
.field .fchip{display:inline-block;background:#A5E1EE;color:#0E4A5A;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:8px;margin-bottom:2px}
.field input{display:block;width:100%;background:transparent;border:none;outline:none;font-size:21px;font-weight:600;color:#0E4A5A;line-height:1.3;padding:2px 0 0}
.field .fsuf{position:absolute;right:15px;bottom:13px;font-size:15px;color:#6E93A0}
.volcard{margin-top:16px;background:#E4F8EE;border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center}
.volcard .drop-c{width:46px;height:46px;border-radius:50%;border:2.5px solid #0B8FA8;display:flex;align-items:center;justify-content:center;color:#0B8FA8;flex:none}
.volcard b{display:block;font-size:15px;font-weight:800;color:#0E4A5A}
.volcard .m3{display:block;font-size:24px;font-weight:800;color:#0AA8BC;margin:1px 0}
.volcard small{display:block;font-size:13px;color:#5F7385}
.presets{display:flex;gap:10px;margin-top:14px}
.preset{flex:1;padding:12px;border-radius:12px;background:#E8EDF0;color:#33475C;font-size:14.5px;font-weight:700}
.preset.on{background:#0B8FA8;color:#fff}
.linkmode{background:none;color:#0AA8BC;font-size:13px;font-weight:700;padding:12px 0 0}
.foot-note{text-align:center;font-size:12px;color:#7C8FA0;margin:16px 18px 6px}
.icon-card{margin:14px 18px 0;background:#F1F7F9;border-radius:14px;padding:13px 14px}
.icon-card b{font-size:13.5px;color:#0E4A5A;display:block}
.icon-card p{font-size:11.5px;color:#5F7385;line-height:1.5;margin-top:3px}
.icon-card button{margin-top:10px;background:#0B8FA8;color:#fff;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:800;display:inline-flex;align-items:center;gap:6px}

/* CLIMA (intacto) */
.wx-big{display:flex;justify-content:center;margin-top:22px}
.wx-temp-line{text-align:center;font-size:31px;font-weight:800;letter-spacing:-1px;margin-top:8px}
.wx-place{text-align:center;font-size:13.5px;color:#5F7385;margin-top:4px;padding:0 16px}
.wx-extra{text-align:center;font-size:12px;color:#7C8FA0;margin-top:2px}
.mini-refresh{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#DFF0F5;color:#0B8FA8;vertical-align:middle;margin-left:8px}
.slab{display:flex;gap:8px;align-items:center;margin:22px 18px 10px;color:#0B8FA8;font-weight:800;letter-spacing:1.2px;font-size:13px;text-transform:uppercase}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:68px;background:#D3F0F7;border-radius:14px;padding:9px 6px;text-align:center}
.hcard .hc-t{display:block;font-size:16px;font-weight:800}
.hcard b{display:block;font-size:14px;font-weight:800;color:#22406B;margin-top:2px}
.hcard .hc-h{display:block;font-size:11px;font-weight:700;color:#5F7385;margin-top:3px}
.days{background:#fff;border-radius:18px;margin:0 16px;padding:4px 14px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.day{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #EEF3F5}
.day:last-child{border-bottom:none}
.d-name{font-size:13.5px;font-weight:800;width:86px;flex:none}
.d-temp{font-size:14px;font-weight:600;color:#22406B;flex:1;white-space:nowrap}
.wbg{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.wbg.red{background:#F45B5B;color:#fff}.wbg.or{background:#F58B2D;color:#fff}
.wbg.yl{background:#FFD54F;color:#6B4E00}.wbg.gr{background:#35B558;color:#fff}
.wx-btns{display:flex;gap:10px;margin:20px 18px 4px}
.o-btn{flex:1;padding:13px;border-radius:12px;border:2px solid #0B8FA8;color:#0B8FA8;font-size:15px;font-weight:800;background:#fff}
.t-btn{flex:1;padding:13px;border-radius:12px;background:#0B8FA8;color:#fff;font-size:15px;font-weight:800}
.wx-foot{text-align:center;font-size:11.5px;color:#7C8FA0;margin:14px 0 4px}
.wx-load{text-align:center;padding:40px 20px}
.spinner{width:28px;height:28px;border:3.5px solid #CFE9EE;border-top-color:#0B8FA8;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wx-load p{font-weight:700;font-size:14px;color:#22406B}
.wx-load small{display:block;color:#7C8FA0;margin-top:5px;font-weight:500;font-size:12px}
.offcard{margin:16px 16px 0;background:#FFF3DE;border-radius:14px;padding:13px 14px;border-left:4px solid #F08C00}
.offcard b{font-size:13px;color:#7A4A00;display:block}
.offcard span{font-size:11.5px;color:#8A6A34;display:block;margin-top:2px}
.offcard button{margin-top:8px;background:#F08C00;color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.offcard.blue{background:#EAF3FA;border-left-color:#2FA7E0}
.offcard.blue b{color:#14486B}
.offcard.blue button{background:#2FA7E0}

/* HISTÓRICO (intacto) */
.ranges{background:#fff;border-radius:16px;padding:6px;display:flex;gap:8px;margin:14px 16px 0;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.ranges button{flex:1;padding:11px;border-radius:11px;border:1.5px solid #DCE6EA;background:#fff;color:#22406B;font-size:14px;font-weight:700}
.ranges button.on{background:#0B8FA8;border-color:#0B8FA8;color:#fff}
.analysis{margin:14px 16px 0;background:#0B8FA8;border-radius:18px;padding:16px;color:#fff;display:flex;gap:14px;align-items:center}
.analysis .drop-c{width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;flex:none}
.an-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.an-grid b{font-size:16.5px;font-weight:800}
.an-grid span{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.92)}
.an-dot{width:15px;height:15px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.an-upd{font-size:11px;color:#7C8FA0;margin:8px 22px 0}
.evo-h{display:flex;align-items:center;justify-content:space-between;margin:24px 18px 10px}
.evo-h h2{font-size:21px;font-weight:800;color:#0E4A5A}
.evo-h button{color:#0AA8BC;font-size:14px;font-weight:700}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px}
.chc{background:#fff;border-radius:16px;padding:13px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.chc h4{font-size:15px;font-weight:800;color:#0E4A5A}
.chc .trow{display:flex;align-items:center;gap:6px;margin-top:4px}
.chc .tval{font-size:21px;font-weight:800;letter-spacing:-.5px}
.chc .rng{font-size:11px;color:#7C8FA0;margin-top:1px}
.chc .dts{font-size:9px;color:#8FA3B0;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chc .det{font-size:10px;color:#0AA8BC;font-weight:700;margin-top:5px}
.tl-h{display:flex;align-items:center;gap:9px;margin:26px 18px 12px;color:#0E4A5A}
.tl-h h2{font-size:21px;font-weight:800}
.tl{margin:0 18px;position:relative}
.tl-item{position:relative;padding:0 0 20px 34px}
.tl-item::before{content:'';position:absolute;left:9px;top:20px;bottom:-2px;width:2.5px;background:#C9EBF0}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tl-dot.ok{background:#35B558}.tl-dot.warn{background:#F58B2D}.tl-dot.info{background:#2FA7E0}.tl-dot.maint{background:#9AAFB8}
.tl-date{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:3px 9px;border-radius:8px;background:#E7EEF1;color:#22406B;margin-bottom:5px;text-transform:uppercase}
.tl-date.today{background:#0B8FA8;color:#fff}
.tl-item b{display:block;font-size:14px;font-weight:700;line-height:1.35}
.tl-item p{font-size:12px;color:#5F7385;line-height:1.5;margin-top:3px}

/* PLANO */
.ban{background:#E15454;color:#fff;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin:14px 16px 0}
.ban b{display:block;font-size:15px}
.ban span{display:block;font-size:11.5px;color:rgba(255,255,255,.9);margin-top:3px;line-height:1.45}
.step{display:flex;gap:12px;background:#fff;border-radius:18px;padding:15px;margin:12px 16px 0;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.step-n{width:30px;height:30px;border-radius:10px;background:#0B8FA8;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step>div:last-child{flex:1;min-width:0}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step-head h4{font-size:14.5px;letter-spacing:-.2px}
.sbdg{font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.sbdg.ok{background:#DFF3D6;color:#256B2F}.sbdg.warn{background:#FFE2B0;color:#8A5200}
.sbdg.bad{background:#F8C1C1;color:#8E2020}.sbdg.later{background:#D6F1F6;color:#0E7183}
.dose{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#EAF7F9;border:1.5px dashed #8FCFDE;border-radius:12px;padding:9px 12px;margin:10px 0 2px}
.dose b{font-size:12.5px;color:#0E4A5A;display:block}
.dose small{font-size:10.5px;color:#7C8FA0;display:block;margin-top:1px}
.dose-v{font-size:14px;font-weight:800;color:#0AA8BC;white-space:nowrap}
.inst{list-style:none;margin-top:9px}
.inst li{position:relative;padding-left:14px;font-size:11.5px;color:#5F7385;line-height:1.5;margin-top:5px}
.inst li::before{content:'';position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:#9DB8C4}
/* ★ NOVO: aviso de vinil nas etapas 1 e 5 */
.vinilwarn{background:#FFF3E0;color:#8A5200;font-size:11.5px;font-weight:700;border-radius:10px;padding:8px 10px;margin-top:9px;line-height:1.45}
.plan-meta{margin:12px 18px 0;font-size:12px;color:#7C8FA0;font-weight:600}
.fine{font-size:11px;color:#8FA3B0;margin:14px 18px 0;line-height:1.55}
.center{text-align:center}

/* DICAS */
.tip{background:#fff;border-radius:16px;padding:14px;display:flex;gap:13px;margin:0 16px 12px;box-shadow:0 2px 6px rgba(20,40,70,.05)}
.tip-ic{width:40px;height:40px;border-radius:12px;background:#DFF0F5;color:#0B8FA8;display:flex;align-items:center;justify-content:center;flex:none}
.tip-body{flex:1}
.tip-body b{font-size:14.5px}
.tip-body p{font-size:12.5px;color:#5F7385;line-height:1.5;margin-top:3px}
.tip-btn{color:#0AA8BC;font-size:13px;font-weight:800;padding:8px 0 0;display:flex;align-items:center;gap:4px}
/* ★ NOVO: cards de revestimento com borda turquesa */
.revtip{background:#fff;border:1.5px solid #0B8FA8;border-radius:16px;padding:13px 14px;margin:0 16px 12px}
.revtip b{display:block;font-size:14px;color:#0E4A5A}
.revtip p{font-size:12.5px;color:#5F7385;line-height:1.5;margin-top:3px}

/* ====== ★ NOVO: v-filtro — válvula seletora + manômetro ====== */
.vhlp{margin:14px 16px 0;background:#FFF8E1;border-radius:14px;padding:13px 14px;border-left:4px solid #F0B429}
.vhlp b{display:block;font-size:13px;color:#7A5A00}

<script>
/* =========================================================

const $=s=>document.querySelector(s);

const round5=v=>Math.max(5,Math.round(v/5)*5);
const gW=v=>v>=1000?f1(v/1000)+' kg':round5(v)+' g';
const mlW=v=>v>=1000?f1(v/1000)+' L':round5(v)+' ml';
const ddmm=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

/* ---------- ícones ---------- */
const ICONS={
 home:'<path d="M3.5 11 12 3.5 20.5 11"/><path d="M5.5 9.8V20.5h13V9.8"/>',

 bulb:'<path d="M9.2 18h5.6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 3.6 10.8c-.7.5-1.1 1.3-1.1 2.2H9.5c0-.9-.4-1.7-1.1-2.2A6 6 0 0 1 12 3Z"/>',
 gear:'<circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4l1.9 1.9M16.7 16.7l1.9 1.9M18.6 5.4l-1.9 1.9M7.3 16.7l-1.9 1.9"/>',
 alert:'<path d="M10.3 4.4 2.6 17.6a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.4a2 2 0 0 0-3.4 0Z"/><path d="M12 9.5v4M12 16.8h.01"/>',
 waves:'<path d="M3 9c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 6 0" transform="translate(-1.5 0) scale(.92)"/><path d="M3 15c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 6 0" transform="translate(-1.5 0) scale(.92)"/>',

 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 back:'<path d="M14.5 5.5 8 12l6.5 6.5"/>',
 download:'<path d="M12 4v10.5"/><path d="M7.8 10.8 12 15l4.2-4.2"/><path d="M4.5 19.5h15"/>',
 save:'<path d="M5.5 4.5h10.4l2.6 2.6v12.4h-13Z"/><path d="M8.5 4.5v4.6h7V4.5"/><path d="M8.5 13.5h7v6"/>',
 snow:'<path d="M12 3.5v17M4.6 7.8l14.8 8.4M19.4 7.8 4.6 16.2"/>',
 refresh:'<path d="M20.5 11A8.5 8.5 0 0 0 6.8 5.9L4.5 8.1"/><path d="M4.5 3.5v4.6h4.6"/><path d="M3.5 13a8.5 8.5 0 0 0 13.7 4.9l2.3-2.2"/><path d="M19.5 20.5v-4.6h-4.6"/>',
 pin:'<path d="M12 21.5S5.5 15.8 5.5 11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 10.5-6.5 10.5Z"/><circle cx="12" cy="10.8" r="2.3"/>',

 zap:'<path d="M13 2.5 4.5 13.5h6l-1.5 8 8.5-11h-6l1.5-8Z"/>',
 shieldA:'<path d="M12 2.8 4.8 5.6v5.2c0 4.6 3.1 8.1 7.2 9.7 4.1-1.6 7.2-5.1 7.2-9.7V5.6Z"/><path d="M12 8v4M12 15.2h.01"/>'
};
const icon=(n,s=18)=>'<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';
function pillSparkle(s=22){return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
 +'<g transform="rotate(-35 11 13)"><rect x="2.6" y="9.7" width="16.8" height="6.6" rx="3.3"/><path d="M11 9.7v6.6"/></g>'
 +'<path d="M20.5 3.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8Z" fill="#fff" stroke="none"/></svg>';}

/* ---------- ícones de clima preenchidos (intacto) ---------- */
const CLOUDP='M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z';
function wDrop(x,y,s){return '<path transform="translate('+x+' '+y+') scale('+s+')" fill="#4FA8E0" d="M0 0C1.2 1.6 1.9 2.8 1.9 3.7 1.9 4.9 1 5.7 0 5.7S-1.9 4.9-1.9 3.7C-1.9 2.8-1.2 1.6 0 0Z"/>';}
function wSun(cx,cy,r){let g='<g><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#FFC53D"/>';
 for(let a=0;a<8;a++){const t=a*Math.PI/4;
  g+='<line x1="'+(cx+Math.cos(t)*(r+1.6)).toFixed(2)+'" y1="'+(cy+Math.sin(t)*(r+1.6)).toFixed(2)+'" x2="'+(cx+Math.cos(t)*(r+3)).toFixed(2)+'" y2="'+(cy+Math.sin(t)*(r+3)).toFixed(2)+'" stroke="#FFC53D" stroke-width="1.7" stroke-linecap="round"/>';}
 return g+'</g>';}
function wCloud(fill,tf){return '<g transform="'+tf+'"><path d="'+CLOUDP+'" fill="'+fill+'"/></g>';}
function bigWx(code,s=28){
 let inner;
 if(code===0)inner=wSun(12,12,4.4);
 else if(code===1||code===2)inner=wSun(16.5,7.5,3.1)+wCloud('#93A6B8','translate(-2 3.2) scale(.8)');
 else if(code===3||code===45||code===48)inner=wCloud('#93A6B8','translate(0 1.4) scale(.94)');
 else if(code>=51&&code<=57)inner=wCloud('#5A7396','translate(1 -1) scale(.8)')+wDrop(8.6,17.6,.9)+wDrop(13.4,19.2,.9);
 else if(code>=61&&code<=67||code>=80&&code<=82)inner=wCloud('#3E5578','translate(1 -2.4) scale(.8)')+wDrop(7.6,17,.85)+wDrop(12.2,19,.85)+wDrop(16.6,17,.85);
 else if(code>=95)inner=wCloud('#1F2E56','translate(1 -2.6) scale(.8)')
   +wDrop(6.8,17.4,.8)+wDrop(16.8,17.4,.8)
   +'<path d="M13.6 12.6 9.2 19h2.7l-1.2 4.2 5.2-6.6h-2.9l1.7-4Z" fill="#FFC53D"/>';
 else inner=wCloud('#93A6B8','translate(0 1.4) scale(.94)');
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" aria-hidden="true">'+inner+'</svg>';
}
function describeCode(c){
 if(c===0)return'Céu limpo';if(c===1)return'Predomínio de sol';if(c===2)return'Parcialmente nublado';if(c===3)return'Nublado';
 if(c===45||c===48)return'Neblina';if(c>=51&&c<=57)return'Garoa';
 if(c===61)return'Chuva leve';if(c===63)return'Chuva';if(c===65)return'Chuva forte';
 if(c>=71&&c<=77)return'Neve';if(c===80||c===81)return'Pancadas de chuva';if(c===82)return'Pancadas fortes';
 if(c>=96)return'Tempestade com granizo';if(c>=95)return'Tempestade';return'—';
}
function dayBadge(code){
 if(code>=95||code===65||code===82)return{cls:'red',txt:'Evitar'};
 if(code===63||code===80||code===81||code===66||code===67)return{cls:'or',txt:'Cuidado'};
 if(code>=51&&code<=61||code===3)return{cls:'yl',txt:'Atenção'};
 if(code===1||code===2||code===45||code===48)return{cls:'gr',txt:'Baixo risco'};
 return{cls:'gr',txt:'Seguro para abrir'};
}

/* ---------- estado (poolcare_v1 — só ADICIONOU revestimento e pressões) ---------- */
const PLACE_FALLBACK='Miguel Burnier, Ouro Preto - MG';
const FALLBACK_LAT=-20.2977,FALLBACK_LON=-43.7833;
const SHAPES={rect:{label:'Retangular',f:1},round:{label:'Redonda',f:0.785},oval:{label:'Oval',f:0.85},oct:{label:'Oitavada',f:0.87}};
const RANGES={
 ph:{label:'pH',lo:7.2,hi:7.6,unit:''},
 cl:{label:'Cloro',lo:1,hi:3,unit:' mg/L'},
 alk:{label:'Alcalinidade',lo:80,hi:120,unit:' mg/L'},
 hard:{label:'Dureza',lo:200,hi:400,unit:' mg/L'}
};
function lab(i){const t=new Date();t.setDate(t.getDate()-i);return t;}
function defaultState(){return{
 view:'home',
 cfg:{shape:'rect',length:9,width:4,shallow:1.0,deep:1.5,liters:45000,litersMode:'calc',
  revestimento:'azulejo',            /* ★ NOVO: default Azulejo */
  pressaoLimpo:'',pressaoAgora:''},  /* ★ NOVO: manômetro */

 readings:{ph:7.6,cl:0,alk:80,hard:200},
 hist:{
  ph:[{v:7.2,d:ddmm(lab(14))},{v:7.2,d:ddmm(lab(9))},{v:7.6,d:ddmm(lab(4))},{v:7.6,d:ddmm(lab(0))}],
  cl:[{v:0.5,d:ddmm(lab(14))},{v:0.5,d:ddmm(lab(9))},{v:5.0,d:ddmm(lab(4))},{v:0.0,d:ddmm(lab(0))}],
  alk:[{v:60,d:ddmm(lab(14))},{v:70,d:ddmm(lab(9))},{v:80,d:ddmm(lab(4))},{v:80,d:ddmm(lab(0))}],
  hard:[{v:180,d:ddmm(lab(14))},{v:190,d:ddmm(lab(9))},{v:200,d:ddmm(lab(4))},{v:200,d:ddmm(lab(0))}]
 },

 alerts:{storm:true,cloro:true},

};}
let state=defaultState();
function seedEvents(){
 state.events=[
  {type:'warn',d:lab(2),title:'Técnico adicionou cloro e ajustou o pH',desc:'Dosagem de cloro aplicada. pH ajustado para baixo após medição.'},
  {type:'info',d:lab(4),title:'pH 7,8 • Cloro 0,0 — Alerta: pH alto detectado',desc:'Recomendação: aplicar redutor de pH para corrigir.'},
  {type:'maint',d:lab(6),title:'Manutenção realizada',desc:'Limpeza do filtro e coleta de amostra para análise.'}
 ];
}
function loadState(){
 try{
  const raw=localStorage.getItem('poolcare_v1');if(!raw)return;
  const j=JSON.parse(raw);
  if(j.cfg)Object.assign(state.cfg,j.cfg);
  if(j.readings)Object.assign(state.readings,j.readings);
  if(j.hist)['ph','cl','alk','hard'].forEach(k=>{if(Array.isArray(j.hist[k])&&j.hist[k].length)state.hist[k]=j.hist[k];});
  if(j.water)state.water=j.water;
  if(j.alerts)Object.assign(state.alerts,j.alerts);
  if(j.shopChecks)state.shopChecks=j.shopChecks;
  if(j.shopQty)state.shopQty=j.shopQty;
 }catch(e){}
}
function persist(){try{localStorage.setItem('poolcare_v1',JSON.stringify({cfg:state.cfg,readings:state.readings,hist:state.hist,water:state.water,alerts:state.alerts,shopChecks:state.shopChecks,shopQty:state.shopQty}));}catch(e){}}

/* ---------- litragem (intacta) ---------- */
function calcLiters(c){
 const f=SHAPES[c.shape].f,depth=((+c.shallow)+(+c.deep))/2;
 const area=c.shape==='round'?Math.pow(+c.length,2):(+c.length)*(+c.width);
 return Math.round(depth*area*f*1000/100)*100;

const litersOf=()=>state.cfg.litersMode==='direct'?(+state.cfg.liters||0):calcLiters(state.cfg);

/* ---------- getPhStatus (intacta) ---------- */
function getPhStatus(ph,cl){
 if(cl<1){
  if(ph>7.4){
   const ml=round5(Math.abs(ph-7.2)*10*4*(litersOf()/1000));
   return{label:'ALTO P/ CHOQUE',cor:'orange',dose:ml+' ml de ácido',ml:ml,precisaCorrigir:true,
    texto:'pH '+f1(ph)+' perde até 50% da eficácia do cloro. Abaixe para 7,2 antes do choque (faixa do choque: 7,0–7,4).'};
  }
  if(ph<7.0){
   const g=round5((7.2-ph)*10*18*(litersOf()/1000));
   return{label:'BAIXO P/ CHOQUE',cor:'orange',dose:gW(g)+' de barrilha',precisaCorrigir:true,
    texto:'pH '+f1(ph)+' abaixo da faixa do choque. Suba para 7,2 com barrilha (faixa do choque: 7,0–7,4).'};
  }
  return{label:'Ideal',cor:'green',precisaCorrigir:false,
   texto:'pH '+f1(ph)+' dentro da faixa do choque (7,0–7,4). Pode aplicar o cloro.'};
 }
 if(ph>7.6){
  const ml=round5((ph-7.4)*10*4*(litersOf()/1000));
  return{label:'ALTO',cor:'orange',dose:ml+' ml de ácido',precisaCorrigir:true,
   texto:'pH '+f1(ph)+' acima do teto 7,6. Aplique redutor de pH.'};
 }
 if(ph<7.2){
  const g=round5((7.4-ph)*10*18*(litersOf()/1000));
  return{label:'BAIXO',cor:'orange',dose:gW(g)+' de barrilha',precisaCorrigir:true,
   texto:'pH '+f1(ph)+' abaixo da faixa 7,2–7,6. Aplique barrilha.'};
 }
 return{label:'Ideal',cor:'green',precisaCorrigir:false,
  texto:'pH '+f1(ph)+' dentro da faixa normal 7,2–7,6.'};
}
const phOkCtx=(ph,cl)=>cl<1?(ph>=7.0&&ph<=7.4):(ph>=7.2&&ph<=7.6);
function statOf(k,v){const r=RANGES[k];return(v>=r.lo&&v<=r.hi)?{cls:'ok',txt:'Ideal'}:{cls:'warn',txt:v<r.lo?'Baixo':'Alto'};}
function isBanhoProibido(){return state.readings.cl<1||state.water==='verde';}
function otherProblemBanner(){
 const r=state.readings;
 if(!phOkCtx(r.ph,r.cl)){const s=getPhStatus(r.ph,r.cl);return{t:'Atenção: pH '+s.label.toLowerCase(),p:s.texto};}
 if(r.alk<80||r.alk>120)return{t:'Atenção: Alcalinidade '+(r.alk>120?'alta':'baixa'),p:'A alcalinidade está fora do ideal (80–120 mg/L). Ajuste com barrilha ou redutor de pH.'};
 if(r.hard<200||r.hard>400)return{t:'Atenção: Dureza '+(r.hard>400?'alta':'baixa'),p:'A dureza está fora do ideal (200–400 mg/L). Corrija em outro dia do choque de cloro.'};
 if(r.cl>3)return{t:'Atenção: Cloro alto',p:'Cloro acima de 3,0 ppm. Suspenda a dosagem e re-meça em 24 h.'};
 return null;
}
function poolVerdict(){
 const w=state.weather;if(!w||!w.daily||!w.daily[0])return null;
 const c=w.current.code,pop=w.daily[0].pop;
 if(c>=95||c===65||c===82)return{cls:'bad',t:'Tempestade',d:'Cubra a piscina, suspenda a dosagem e re-meça o cloro depois da chuva.'};
 if(c>=60||pop>=60)return{cls:'warn',t:'Chuva no radar',d:'Cubra a piscina hoje; chuva dilui o cloro — re-meça amanhã cedo.'};
 return{cls:'ok',t:'Condições ótimas',d:'Dia perfeito para dosar produtos e deixar o filtro trabalhando.'};
}

function climaTop(){

  +'<h1>Clima e Piscina</h1><button class="t-btn" onclick="go(\'home\')" aria-label="Fechar">'+icon('x',22)+'</button></header>';
}
function fetchT(url,ms){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
 return fetch(url,{signal:ctl.signal}).finally(()=>clearTimeout(t));}
function validWx(f){
 try{
  if(!f||typeof f!=='object')return false;
  if(!f.current||typeof f.current.temp!=='number'||typeof f.current.code!=='number')return false;
  if(!Array.isArray(f.hourly)||!f.hourly.length||!Array.isArray(f.daily)||!f.daily.length)return false;
  if(typeof f.hourly[0].temp!=='number'||typeof f.daily[0].min!=='number')return false;
  return true;
 }catch(e){return false;}
}
function getGpsCoords(ms){
 return new Promise(res=>{
  if(!('geolocation' in navigator)||location.protocol==='file:'){res(null);return;}
  let done=false;
  const t=setTimeout(()=>{if(!done){done=true;res(null);}},ms+500);
  navigator.geolocation.getCurrentPosition(
   p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude});},
   ()=>{if(done)return;done=true;clearTimeout(t);res(null);},
   {enableHighAccuracy:true,timeout:ms,maximumAge:300000});
 });
}
async function reverseNominatim(lat,lon){
 try{
  const r=await fetchT('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+lat+'&lon='+lon+'&accept-language=pt-BR',5000);
  if(r.ok){
   const j=await r.json(),a=j.address||{};
   const nome=a.village||a.town||a.suburb||a.city_district||a.city||a.county||'';
   if(nome){const uf=((a['ISO3166-2-lvl4']||'').split('-')[1])||'';return nome+(uf?' - '+uf:'');}
  }
 }catch(e){}
 return null;
}
async function ipapiLoc(){
 try{
  const r=await fetchT('https://ipapi.co/json/',5000);
  if(r.ok){
   const j=await r.json();
   if(typeof j.latitude==='number'&&typeof j.longitude==='number')
    return{lat:j.latitude,lon:j.longitude,place:[j.city,j.region].filter(Boolean).join(', ')||null};
  }
 }catch(e){}
 return null;
}
async function getRealLocation(){
 const gps=await getGpsCoords(8000);
 if(gps){
  const nome=await reverseNominatim(gps.lat,gps.lon).catch(()=>null);
  return{lat:gps.lat,lon:gps.lon,place:nome||'Minha localização (GPS)',gps:true};
 }
 const ip=await ipapiLoc();
 if(ip)return{lat:ip.lat,lon:ip.lon,place:ip.place||'Localização aproximada',gps:false};
 return{lat:FALLBACK_LAT,lon:FALLBACK_LON,place:PLACE_FALLBACK,gps:false};
}
async function fetchForecast(lat,lon){
 const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon
 +'&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'
 +'&hourly=temperature_2m,precipitation_probability,weather_code'
 +'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
 +'&forecast_days=7&timezone=auto';
 try{
  const res=await fetchT(url,7000);   /* fetchT timeout 7s — INTACTO */
  if(!res.ok)return null;
  const j=await res.json();
  let idx=j.hourly.time.findIndex(t=>new Date(t).getTime()>=Date.now()-36e5);if(idx<0)idx=0;
  return{simulated:false,at:new Date(),
   current:{temp:Math.round(j.current.temperature_2m),feels:Math.round(j.current.apparent_temperature),
    code:j.current.weather_code,wind:Math.round(j.current.wind_speed_10m),hum:j.current.relative_humidity_2m},
   hourly:j.hourly.time.slice(idx,idx+12).map((t,i)=>({label:i===0?'Agora':new Date(t).getHours()+'h',
    temp:Math.round(j.hourly.temperature_2m[idx+i]),pop:(j.hourly.precipitation_probability[idx+i]??0),code:j.hourly.weather_code[idx+i]})),
   daily:j.daily.time.map((t,i)=>{const d=new Date(t+'T12:00');
    return{label:i===0?'Hoje, '+ddmm(d):DOW[d.getDay()]+', '+ddmm(d),
     min:Math.round(j.daily.temperature_2m_min[i]),max:Math.round(j.daily.temperature_2m_max[i]),
     pop:(j.daily.precipitation_probability_max[i]??0),code:j.daily.weather_code[i]};})};
 }catch(e){return null;}
}
/* simulateForecast — fallback igual ao print real (intacto) */
function simulateFallback(){
 const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[ri(0,a.length-1)];
 const base=new Date();const hours=[],days=[];
 const pops=[60,40,40,40,30,25,20,20,15,15,10,10],codes=[61,95,95,95,80,61,80,61,3,3,2,2];
 for(let i=0;i<12;i++)hours.push({label:i===0?'Agora':((base.getHours()+i)%24)+'h',temp:25-((i/4)|0),pop:pops[i],code:codes[i]});
 const seq=[95,3,2,2,0,0,2];
 for(let i=0;i<7;i++){const d=new Date(base);d.setDate(base.getDate()+i);
  days.push({label:i===0?'Hoje, '+ddmm(d):DOW[d.getDay()]+', '+ddmm(d),min:15+ri(0,2),max:25+i-((i/2)|0),
   pop:seq[i]===95?60:ri(5,30),code:seq[i]});}
 return{simulated:true,place:PLACE_FALLBACK,at:new Date(),
  current:{temp:25,feels:26,code:61,wind:3,hum:88},hourly:hours,daily:days};
}
function cacheWx(w){try{localStorage.setItem('poolcare_wx',JSON.stringify({w:w,ts:Date.now()}));}catch(e){}}
function readWxCache(){
 try{
  const j=JSON.parse(localStorage.getItem('poolcare_wx')||'null');
  if(j&&j.w&&!j.w.simulated&&validWx(j.w))return j;
 }catch(e){}
 return null;
}
function cacheGeo(g){try{localStorage.setItem('poolcare_geo',JSON.stringify(g));}catch(e){}}
function readGeo(){try{return JSON.parse(localStorage.getItem('poolcare_geo')||'null');}catch(e){return null;}}

let wxToken=0,geoToasted=false;
/* watchdog setTimeout 6000ms — INTACTO: nunca trava em "Carregando..." */
function loadWeather(silent){
 const my=++wxToken;
 if(!silent){state.wxLoading=true;render();}
 let painted=false;
 const wd=setTimeout(fallback,6000);
 function paint(f,note){
  if(my!==wxToken)return;
  if(!f||!validWx(f))return;
  clearTimeout(wd);painted=true;
  state.wxLoading=false;state.weather=f;
  if(!f.simulated)cacheWx(f);
  render();
  if(note)toast(note);
 }
 function fallback(){
  if(my!==wxToken||painted)return;
  clearTimeout(wd);painted=true;
  const c=readWxCache();
  state.wxLoading=false;
  state.weather=c?Object.assign({},c.w,{cached:true}):simulateFallback();
  render();
 }
 let pend=2;
 function settle(){if(my!==wxToken)return;if(--pend===0)fallback();}
 const geo=readGeo();
 const base=(geo&&geo.lat)?{lat:geo.lat,lon:geo.lon,place:geo.place||PLACE_FALLBACK}
                          :{lat:FALLBACK_LAT,lon:FALLBACK_LON,place:PLACE_FALLBACK};
 fetchForecast(base.lat,base.lon)
  .then(f=>{if(my!==wxToken)return;if(f)paint(Object.assign(f,{place:base.place,approx:!geo}),null);})
  .catch(()=>{}).finally(settle);
 getRealLocation().then(async loc=>{
  if(my!==wxToken)return;
  const f=await fetchForecast(loc.lat,loc.lon);
  if(my!==wxToken)return;
  if(f){
   f.place=loc.place;
   cacheGeo({lat:loc.lat,lon:loc.lon,place:loc.place});
   const dif=Math.abs(loc.lat-FALLBACK_LAT)>0.05||Math.abs(loc.lon-FALLBACK_LON)>0.05;
   paint(f,(dif&&!geoToasted)?('Clima da sua localização: '+loc.place):null);
   if(dif)geoToasted=true;
  }
 }).catch(()=>{}).finally(settle);
}

/* ==================== HISTÓRICO (intacto — gráficos SVG) ==================== */
function smoothChart(pts){
 const W=300,H=64,iw=W-8;
 const vals=pts.map(p=>p.v);
 const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
 const pad=(hi-lo)*0.25||0.6,yMin=lo-pad,yMax=hi+pad;
 const X=i=>4+iw*i/Math.max(1,pts.length-1);
 const Y=v=>6+(H-14)*(1-(v-yMin)/(yMax-yMin));
 const P=vals.map((v,i)=>({x:X(i),y:Y(v)}));
 let d='M'+P[0].x.toFixed(1)+' '+P[0].y.toFixed(1);
 for(let i=1;i<P.length;i++){const xc=((P[i-1].x+P[i].x)/2).toFixed(1),yc=((P[i-1].y+P[i].y)/2).toFixed(1);
  d+=' Q'+P[i-1].x.toFixed(1)+' '+P[i-1].y.toFixed(1)+' '+xc+' '+yc;}
 d+=' L'+P[P.length-1].x.toFixed(1)+' '+P[P.length-1].y.toFixed(1);
 const area=d+' L'+P[P.length-1].x.toFixed(1)+' '+H+' L'+P[0].x.toFixed(1)+' '+H+' Z';
 const last=P[P.length-1];
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block;margin-top:6px" aria-hidden="true">'
  +'<path d="'+area+'" fill="#DDF3F7"/>'
  +'<path d="'+d+'" fill="none" stroke="#22B6CB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
  +'<circle cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="3.6" fill="#14B8C9" stroke="#fff" stroke-width="1.6"/></svg>';
}
function trendArrow(pts){
 const up=pts[pts.length-1].v>=pts[0].v;
 const p=up?'<path d="M3 10 8 5l3 3 5-5"/><path d="M12 3h4v4"/>':'<path d="M3 4l5 5 3-3 5 5"/><path d="M12 11h4V7"/>';
 return '<svg width="17" height="15" viewBox="0 0 17 14" fill="none" stroke="'+(up?'#35B558':'#F58B2D')+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

window.downloadIcons=()=>{

  const g=x.createLinearGradient(0,0,S,S);g.addColorStop(0,'#35C4B5');g.addColorStop(1,'#0B8FA8');
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};
  rr(0,0,S,S,110*u);x.fillStyle=g;x.fill();
  x.strokeStyle='#fff';x.lineJoin='round';x.lineCap='round';x.lineWidth=24*u;
  x.beginPath();x.moveTo(92*u,268*u);x.lineTo(178*u,160*u);x.lineTo(334*u,160*u);x.lineTo(420*u,268*u);x.closePath();x.stroke();
  x.fillStyle='rgba(255,255,255,.38)';

  const wave=(y,a)=>{x.globalAlpha=a;x.beginPath();x.moveTo(84*u,y*u);
   x.bezierCurveTo(140*u,(y-26)*u,180*u,(y-26)*u,236*u,y*u);
   x.bezierCurveTo(292*u,(y+26)*u,332*u,(y+26)*u,388*u,y*u);
   x.bezierCurveTo(420*u,(y-18)*u,444*u,(y-16)*u,460*u,y*u);x.stroke();x.globalAlpha=1;};
  wave(340,1);wave(408,.6);
  return c.toDataURL('image/png');
 };
 [['icon-192.png',192],['icon-512.png',512]].forEach(([n,S],i)=>{
  setTimeout(()=>{const a=document.createElement('a');a.download=n;a.href=draw(S);document.body.appendChild(a);a.click();a.remove();},i*500);
 });

/* ============================================================
 PLANO (v-calc) — intacto; ★ NOVO: linha de VINIL nas etapas 1 e 5
 ============================================================ */
function gerarPlano(){
 const L=litersOf(),k=L/1000,r=state.readings,verde=state.water==='verde',turva=state.water==='turva';
 const F={choqueSimples:14,choqueDuplo:28,sulfato:10,clarificante:2,algicida:6};
 const etapas=[];
 const choqueNec=r.cl<1||verde;
 {
  const ps=getPhStatus(r.ph,r.cl);
  if(ps.label==='Ideal'){
   etapas.push({t:'pH da água',bdg:['ok',choqueNec?'IDEAL P/ CHOQUE':'EM ORDEM'],inst:[ps.texto]});
  }else{
   const barrilha=ps.label.indexOf('BAIXO')===0;
   const pChoque=ps.label.indexOf('CHOQUE')>-1;
   etapas.push({t:'pH da água',bdg:['warn',ps.label],prod:barrilha?'Elevador de pH (barrilha)':'Redutor de pH (ácido muriático)',
    chem:pChoque?(barrilha?'suba o pH ANTES do choque':'abaixe o pH ANTES do choque'):'faixa normal: 7,2–7,6',
    dose:ps.dose,
    inst:pChoque?[
     'Cloro com pH '+f1(r.ph)+' perde até 50% da eficácia — '+(barrilha?'suba':'abaixe')+' para 7,2 antes do choque (faixa do choque: 7,0–7,4).',
     'Aplique 1/3 da dose com o filtro ligado, espere 4 h, re-meça e complete se precisar.',
     'Só parta para o choque da etapa 3 com o pH em 7,0–7,4.']
    :(barrilha?['pH '+f1(r.ph)+' abaixo da faixa 7,2–7,6. Dilua em balde e distribua com o filtro ligado; re-meça em 4–6 h.']
              :['pH '+f1(r.ph)+' acima do teto. Aplique 1/3 da dose com o filtro ligado, espere 4 h, re-meça e complete se precisar.'])});
  }
 }
 if(r.alk<80){const g=round5(((80-r.alk)/10)*18*k);
  etapas.push({t:'Alcalinidade (AT)',bdg:['warn','Ajustar'],prod:'Barrilha',chem:'carbonato de sódio — sobe a AT',dose:gW(g),
   inst:['Aplique com o filtro ligado e re-meça a AT em 6 h.','Barrilha sobe o pH junto: confira o pH depois desta etapa.']});}
 else if(r.alk>120){const ml=round5(((r.alk-120)/10)*10*k);
  etapas.push({t:'Alcalinidade (AT)',bdg:['warn','Ajustar'],prod:'Redutor de pH (ácido muriático)',chem:'também derruba a AT',dose:mlW(ml),
   inst:['Dosifique aos poucos, com filtro ligado.','Re-meça após 6 h de filtração.']});}
 else etapas.push({t:'Alcalinidade (AT)',bdg:['ok','EM ORDEM'],inst:['AT em '+f0(r.alk)+' mg/L, dentro da faixa 80–120. A AT estabiliza o pH.']});
 if(r.cl<1){
  const g=verde?F.choqueDuplo*k:F.choqueSimples*k;
  etapas.push({t:verde?'Cloro — choque duplo':'Cloro — choque simples',bdg:['bad','CHOQUE'],
   prod:'Cloro granulado 65%',chem:'hipoclorito de cálcio',dose:gW(g)+(verde?' • 2× '+gW(g/2):''),
   inst:['Confirme o pH em 7,0–7,4 (etapa 1) antes de aplicar.',
    'Aplique ao anoitecer, com o filtro ligado.',
    'Dissolva em balde e distribua; escove as paredes antes.',
    'Meça em 12–24 h — banho liberado entre 1 e 3 ppm.',
    verde?'Água verde: repita a dose em 24 h se continuar esverdeada.':'']});
 }else if(r.cl>3){
  etapas.push({t:'Cloro',bdg:['warn','Aguardar'],inst:['Cloro em '+f1(r.cl)+' ppm: suspenda a dosagem, retire a capa e deixe o sol agir.','Meça amanhã — banho liberado entre 1 e 3 ppm.']});
 }else{
  etapas.push({t:'Cloro',bdg:['ok','EM ORDEM'],inst:['Cloro em '+f1(r.cl)+' ppm. Manutenção diária: '+gW(round5(3*k))+' de cloro, de preferência à noite.']});
 }
 if(r.hard<200){const kg=Math.max(1,Math.round(((200-r.hard)/10)*0.85*(L/10000)*10)/10);
  etapas.push({t:'Dureza cálcica',bdg:['later','OUTRO DIA'],prod:'Cloreto de cálcio',chem:'elevador de dureza',dose:f1(kg)+' kg',
   inst:['Etapa para outro dia: nunca misture com o dia do choque de cloro.','Espalhe o produto com o filtro ligado e filtre 8 h.']});}
 else if(r.hard>400){
  etapas.push({t:'Dureza cálcica',bdg:['later','OUTRO DIA'],prod:'Rebosamento',chem:'sem produto químico',dose:f0(L*0.25)+' L',
   inst:['Drene cerca de 25% do volume ('+f0(L*0.25)+' L) e complete com água nova.','Meça de novo antes de qualquer química.']});}
 else etapas.push({t:'Dureza cálcica',bdg:['later','OUTRO DIA'],inst:['Dureza em '+f0(r.hard)+' mg/L, dentro da faixa 200–400. Corrija (se precisar) em outro dia do choque.']});
 if(verde){const al=round5(F.algicida*k),cl=round5(F.clarificante*k);
  etapas.push({t:'Água verde — aparência',bdg:['bad','TRATAR'],prod:'Algicida de choque + clarificante',chem:'aplicar depois do choque de cloro',dose:mlW(al)+' + '+mlW(cl),
   inst:['Escove paredes e fundo antes de aplicar o algicida de choque.','Filtro por 24 h ininterruptas; aspire o sedimento no dia seguinte.','Complete com clarificante e mantenha o filtro rodando.']});
 }else if(turva){const su=round5(F.sulfato*k),cl=round5(F.clarificante*k);
  etapas.push({t:'Água turva — aparência',bdg:['warn','TRATAR'],prod:'Sulfato de alumínio + clarificante',chem:'floculante',dose:gW(su)+' + '+mlW(cl),
   inst:['Filtro em RECIRCULAR: aplique o sulfato e recircule 30 min.',
    'Desligue o filtro por 12 h e deixe o sedimento decantar no fundo.',
    'Aspire o fundo em ESGOTO/DRENAR bem devagar, sem levantar a sujeira.',
    'Volte a válvula para FILTRAR, complete com clarificante e filtre 24 h.']});
 }else{
  etapas.push({t:'Aparência da água',bdg:['ok','EM ORDEM'],inst:['Água '+state.water+'. Peneire a superfície, escove as paredes e mantenha 6 h/dia de filtração.','Clarificante de manutenção a cada 15 dias ('+mlW(round5(F.clarificante*k))+').']});
 }
 return{L,k,F,etapas,choqueNec,banho:r.cl<1||verde};
}

 const el=document.getElementById('manResult');if(!el)return;

 const limpo=parseFloat(li&&li.value)||0.4;

 if(isNaN(agora)){el.innerHTML='<div class="mres org">Ligue a bomba e informe a pressão AGORA para verificar.</div>';return;}
 const dif=agora-limpo;
 if(agora>=limpo+0.5){
  el.innerHTML='<div class="mres red">⚠️ LAVAR FILTRO AGORA — a pressão subiu '+dif.toFixed(1).replace('.',',')+' bar acima do limpo ('+f1(limpo)+'). Com a bomba desligada, gire para RETROLAVAR e ligue por 1–2 min; depois ENXÁGUE por 30 s e volte para FILTRAR.</div>';
 }else{
  el.innerHTML='<div class="mres grn">✅ Pressão OK — '+f1(agora)+' bar (limpo: '+f1(limpo)+'). Verifique de novo quando subir 0,5 acima do limpo.</div>';
 }
};

 +'<button class="m-btn" onclick="btnBaixarPDF()">'+icon('download',20)+' Baixar PDF</button>'
 +'<button class="m-ghost" onclick="resetShopQty()">Restaurar quantidades padrão</button>'
 +'</div>');
 renderShop();
};
function renderShop(){
 const el=document.getElementById('shopBody');if(!el)return;
 el.innerHTML=SHOP_LIST.map((i,idx)=>{
  const on=state.shopChecks[idx]!==false;
  const q=((state.shopQty[idx]||'').trim()||i.qty).replace(/"/g,'&quot;');
  return '<div class="shop-it">'
   +'<button class="shk'+(on?' on':'')+'" onclick="toggleShop('+idx+')" aria-label="Incluir no PDF">'+icon('check',14)+'</button>'
   +'<span class="shop-n"><b>'+i.name+'</b><small>'+i.cat+'</small></span>'
   +'<input class="qin" type="text" value="'+q+'" oninput="setShopQty('+idx+',this.value)" aria-label="Quantidade de '+i.name+'">'
   +'</div>';
 }).join('');
 const cnt=document.getElementById('shopCnt');
 if(cnt)cnt.innerHTML='<span>Itens no PDF</span><span>'+shopItems().length+' de '+SHOP_LIST.length+'</span>';
}
window.toggleShop=i=>{state.shopChecks[i]=state.shopChecks[i]===false?true:false;persist();renderShop();};
window.setShopQty=(i,v)=>{state.shopQty[i]=v;persist();};
window.resetShopQty=()=>{state.shopQty={};state.shopChecks={};persist();renderShop();toast('Quantidades restauradas ao padrão.');};

const PDF_H=297,MPT=2.83465;
const C_NAVY=[0.043,0.184,0.353],C_LINE=[0.894,0.894,0.894],C_BLACK=[0,0,0],
      C_WHITE=[1,1,1],C_FOOT=[0.4,0.4,0.4],C_FBG=[0.96,0.96,0.96],C_FLN=[0.85,0.85,0.85];
function pNum(v){return (Math.round(v*100)/100).toString();}
function pEsc(s){let o='';for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
 if(c>255){o+='?';continue;}
 if(c===92){o+='\\\\';continue;}
 if(c===40){o+='\\(';continue;}
 if(c===41){o+='\\)';continue;}
 o+=s[i];}return o;}
function pRect(x,y,w,h,rgb,fill,lw){const yy=pNum((PDF_H-y-h)*MPT);
 return pNum(rgb[0])+' '+pNum(rgb[1])+' '+pNum(rgb[2])+(fill?' rg ':' RG ')
  +(fill?'':pNum((lw||0.4)*MPT)+' w ')
  +pNum(x*MPT)+' '+yy+' '+pNum(w*MPT)+' '+pNum(h*MPT)+' re '+(fill?'f':'S')+'\n';}
function pLine(x1,y1,x2,y2,rgb,wmm){const Y=v=>pNum((PDF_H-v)*MPT);
 return pNum(rgb[0])+' '+pNum(rgb[1])+' '+pNum(rgb[2])+' RG '+pNum(wmm*MPT)+' w '
  +pNum(x1*MPT)+' '+Y(y1)+' m '+pNum(x2*MPT)+' '+Y(y2)+' l S\n';}
function pText(x,y,s,bold,pt,rgb,xRight){const Y=pNum((PDF_H-y)*MPT);
 let tx=x*MPT;
 if(xRight){const w=s.length*pt*(bold?0.58:0.52)/MPT;tx=(xRight-w)*MPT;}
 return 'BT /'+(bold?'F2':'F1')+' '+pNum(pt)+' Tf '+pNum(rgb[0])+' '+pNum(rgb[1])+' '+pNum(rgb[2])+' rg '
  +pNum(tx)+' '+Y+' Td ('+pEsc(s)+') Tj ET\n';}

function buildShoppingPages(){
 const L=litersOf();
 const pages=[];let cur=[];
 const newPage=()=>{cur=[];pages.push(cur);return cur;};
 newPage();
 cur.push(pRect(0,0,210,24,C_NAVY,true));
 cur.push(pText(14,11,'PISCINA INTELIGENTE',true,13.5,C_WHITE));
 cur.push(pText(14,18.5,f0(L)+' L • '+SHAPES[state.cfg.shape].label+' • Miguel Burnier, Ouro Preto - MG',false,8,C_WHITE));
 let y=34;
 ['QUÍMICOS','ACESSÓRIOS'].forEach(cat=>{
  if(y>PDF_H-40){newPage();y=24;}
  cur.push(pText(14,y,cat,true,8.3,C_NAVY));
  cur.push(pLine(14,y+1.7,14+cat.length*8.3*0.62/MPT,y+1.7,C_NAVY,0.5));
  y+=9;
  shopItems().filter(i=>i.cat===cat).forEach(it=>{
   if(y>PDF_H-22){newPage();y=24;}
   cur.push(pRect(14,y-3.4,4,4,C_NAVY,false,0.4));
   cur.push(pText(21,y,it.name,true,7.5,C_BLACK));
   cur.push(pText(0,y,it.qty,false,6.75,C_NAVY,196));
   y+=5.2;
   cur.push(pLine(14,y,196,y,C_LINE,0.2));
   y+=1.8;
  });
  y+=3;
 });
 pages.forEach((pg,i)=>{
  const agora=new Date();
  pg.push(pRect(0,PDF_H-10.6,210,10.6,C_FBG,true));
  pg.push(pLine(0,PDF_H-10.6,210,PDF_H-10.6,C_FLN,0.2));
  /* rodapé EXATO — NÃO MEXER */
  pg.push(pText(8,PDF_H-6.6,"Criado por Elias Costa NEGRET'S | Whatsapp (31) 98251-7147 | Telegram @EliasNegrets | Cachoeira do Campo - MG",false,5,C_FOOT));
  pg.push(pText(0,PDF_H-6.6,agora.toLocaleDateString('pt-BR')+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'  •  pág '+(i+1)+'/'+pages.length,false,5,C_FOOT,202));
 });
 return pages;
}
function buildPdf(pages){
 const nP=pages.length,infoObj=5+2*nP;
 let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
 const offs=[];
 const obj=s=>{offs.push(pdf.length);pdf+=s+'\n';};
 obj('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj');
 obj('2 0 obj\n<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+nP+' >>\nendobj');
 obj('3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj');
 obj('4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj');
 pages.forEach((ops,i)=>{
  const stream=ops.join('');
  obj((5+2*i)+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>\nendobj');
  obj((6+2*i)+' 0 obj\n<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream\nendobj');
 });
 obj(infoObj+' 0 obj\n<< /Title (Lista de Compras - Piscina Inteligente) /Producer (Piscina App) >>\nendobj');
 const xref=pdf.length;
 pdf+='xref\n0 '+(infoObj+1)+'\n0000000000 65535 f \n';
 offs.forEach(o=>{pdf+=String(o).padStart(10,'0')+' 00000 n \n';});
 pdf+='trailer\n<< /Size '+(infoObj+1)+' /Root 1 0 R /Info '+infoObj+' 0 R >>\nstartxref\n'+xref+'\n%%EOF';
 const bytes=new Uint8Array(pdf.length);
 for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&0xFF;
 return bytes;
}
window.btnBaixarPDF=()=>{
 try{
  if(!shopItems().length){toast('Marque pelo menos 1 item na lista.','warn');return;}
  const L=litersOf();
  const bytes=buildPdf(buildShoppingPages());
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Lista-Piscina-'+Math.round(L/1000)+'kL-'+new Date().toISOString().slice(0,10)+'.pdf';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  closeModal();
  toast('PDF baixado: '+a.download);
 }catch(e){console.error(e);toast('Não consegui gerar o PDF.','warn');}
};

/* ============================================================
 PWA (intacto) — botão instalar some ao instalar
 ============================================================ */
let deferredPrompt=null,canInstall=false;
function isAppInstalled(){
 return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)
  || window.navigator.standalone===true
  || (function(){try{return localStorage.getItem('pwa_installed')==='1';}catch(e){return false;}})();
}
function syncPwaCard(){
 const el=document.getElementById('pwaCard');
 if(el)el.style.display=(canInstall&&!isAppInstalled())?'flex':'none';
}
window.installPWA=()=>{
 if(deferredPrompt){
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(ch=>{
   if(ch&&ch.outcome==='accepted'){try{localStorage.setItem('pwa_installed','1');}catch(e){}}
   deferredPrompt=null;syncPwaCard();
   if(state.view==='home')render();
  }).catch(()=>{deferredPrompt=null;});
  return;
 }
 openModal('<h3>Instalar o Piscina App</h3><p class="m-p">Para fixar o app na tela inicial:</p>'
 +'<div class="mstep"><b>Android — Chrome</b><span>Menu (três pontos) → "Instalar app" ou "Adicionar à tela inicial".</span></div>'
 +'<div class="mstep"><b>iPhone — Safari</b><span>Botão Compartilhar → "Adicionar à Tela de Início".</span></div>'
 +'<button class="m-btn" onclick="closeModal()">Entendi</button>');
};
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();
 deferredPrompt=e;
 canInstall=true;
 if(!isAppInstalled())syncPwaCard();
});
window.addEventListener('appinstalled',()=>{
 canInstall=false;deferredPrompt=null;
 try{localStorage.setItem('pwa_installed','1');}catch(e){}
 const el=document.getElementById('pwaCard');
 if(el)el.style.display='none';
 toast('Piscina App instalado! Botão removido do Início.');
});
function openModal(html){$('#modal-root').innerHTML='<div class="m-back" onclick="if(event.target===this)closeModal()"><div class="m-card">'+html+'</div></div>';}
window.closeModal=()=>{$('#modal-root').innerHTML='';};
function toast(msg,type){const t=document.createElement('div');t.className='toast'+(type?' '+type:'');t.textContent=msg;
 $('#toast-root').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
 setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),320);},2600);}

 $('#tabbar').innerHTML=[
 ['home','Início','home'],['clima','Clima','cloud'],['hist','Histórico','bars'],['dicas','Dicas','bulb']
].map(x=>'<button data-v="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+icon(x[2],22)+'<span>'+x[1]+'</span></button>').join('');

document.addEventListener('DOMContentLoaded',()=>{
 const APP_VER='3.7';
 try{
  if(localStorage.getItem('poolcare_ver')!==APP_VER){
   localStorage.removeItem('poolcare_wx');
   localStorage.removeItem('poolcare_geo');
   localStorage.setItem('poolcare_ver',APP_VER);
  }

 loadState();seedEvents();
 if(isAppInstalled())canInstall=false;
 render();

 if(c&&Date.now()-c.ts<3600000){

  render();loadWeather(true);
 }else loadWeather(false);
 setInterval(()=>loadWeather(true),30*60*1000);
 if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 }
 if(window.matchMedia){
  const mq=window.matchMedia('(display-mode: standalone)');

 }
